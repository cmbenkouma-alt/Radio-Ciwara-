<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réglages CMS | Radio Ciwara</title><style>body{font-family:Arial,sans-serif;background:#f3f3f1;color:#111;margin:0}.wrap{max-width:1180px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:800;font-size:12px}.input,.area{border:1px solid #ccc;border-radius:8px;padding:10px;box-sizing:border-box}.area{min-height:300px;font-family:monospace;width:100%}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:#087f44;color:#fff}.dark{background:#111}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}.tab{background:#eee;color:#111}.tab.active{background:#d71920;color:#fff}.panel{display:none}.panel.active{display:block}.muted{color:#666;font-size:13px;line-height:1.5}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>Réglages CMS — Radio Ciwara</h1><p class="muted">Gestion séparée de l'en-tête, navigation, pied de page, médias et SEO. Les réglages sont enregistrés dans <code>data/</code> sur la branche CMS. Le lecteur Caster.fm reste indépendant.</p><div id="login"><div class="grid"><div class="field"><label>API</label><input id="api" class="input" value="https://radio-ciwara-admin-api.cmbenkouma.workers.dev"></div><div class="field"><label>Mot de passe</label><input id="pass" class="input" type="password"></div></div><p><button class="btn" onclick="login()">SE CONNECTER</button></p><div id="status"></div></div><div id="app" style="display:none"><div class="tabs"><button class="btn tab active" data-tab="header">Header</button><button class="btn tab" data-tab="navigation">Navigation</button><button class="btn tab" data-tab="footer">Footer</button><button class="btn tab" data-tab="media">Médias</button><button class="btn tab" data-tab="seo">SEO</button></div><div id="panels"></div><p><button class="btn" onclick="saveAll()">ENREGISTRER TOUS LES RÉGLAGES</button> <a href="admin-cms.html">Builder</a> · <a href="index.html">Voir le site</a></p></div></div></main><script>let API='',AUTH='',files={};const $=x=>document.getElementById(x),msg=x=>$('status').textContent=x;async function call(path,opt={}){let r=await fetch(API.replace(/\/$/,'')+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+AUTH}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}async function login(){API=$('api').value.trim();try{let d=await call('/auth',{method:'POST',body:JSON.stringify({password:$('pass').value})});AUTH=d.token;$('login').style.display='none';$('app').style.display='block';await loadAll()}catch(e){msg('Connexion refusée : '+e.message)}}async function loadAll(){for(const name of ['header','navigation','footer','media','seo']){const d=await call('/file?path='+encodeURIComponent('data/cms-'+name+'.json'));files[name]={data:d.data,sha:d.sha};}render()}function render(){const specs={header:'En-tête / identité',navigation:'Navigation & réseaux',footer:'Pied de page',media:'Bibliothèque média',seo:'SEO & partage social'};let h='';for(const [name,s] of Object.entries(specs)){h+=`<section class="panel ${name==='header'?'active':''}" id="p-${name}"><h2>${s}</h2><p class="muted">Configuration JSON complète. Utilisez des URLs absolues pour les images et réseaux sociaux.</p><textarea class="area" id="j-${name}">${esc(JSON.stringify(files[name].data,null,2))}</textarea></section>`}$('panels').innerHTML=h;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('p-'+b.dataset.tab).classList.add('active')})}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}async function saveAll(){try{for(const name of Object.keys(files)){const data=JSON.parse($('j-'+name).value);const r=await call('/file',{method:'PUT',body:JSON.stringify({path:'data/cms-'+name+'.json',data:JSON.stringify(data,null,2),sha:files[name].sha,message:'admin: update CMS '+name})});files[name].sha=r.sha}msg('Tous les réglages sont enregistrés sur GitHub.')}catch(e){msg('Erreur : '+e.message)}}</script></body></html>
