<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réglages CMS | Radio Ciwara</title><style>body{font-family:Arial;background:#f3f3f1;color:#111;margin:0}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.input,.area{border:1px solid #ccc;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}.area{min-height:300px;font-family:monospace}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:#087f44;color:#fff}.gray{background:#555}.red{background:#d71920}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}.tab{background:#eee;color:#111}.tab.active{background:#d71920;color:#fff}.panel{display:none}.panel.active{display:block}.muted{color:#666;font-size:13px;line-height:1.5}.item{border:1px solid #ddd;border-radius:10px;padding:12px;margin:9px 0;background:#fafafa}.asset{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:9px;margin:8px 0}.asset img{width:64px;height:50px;object-fit:cover;background:#eee;border-radius:6px}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.asset{grid-template-columns:50px 1fr}.asset img{width:50px;height:42px}}</style></head><body><main class="wrap"><section class="card"><h1>Réglages CMS — Radio Ciwara</h1><p class="muted">Pages, header, navigation, footer, médias et SEO. Tout est enregistré dans data/ sur la branche CMS. Caster.fm reste indépendant.</p><div id="login"><div class="grid"><div class="field"><label>API</label><input id="api" class="input" value="https://radio-ciwara-admin-api.cmbenkouma.workers.dev"></div><div class="field"><label>Mot de passe</label><input id="pass" class="input" type="password"></div></div><p><button class="btn" onclick="login()">SE CONNECTER</button></p><div id="status"></div></div><div id="app" class="hidden"><p><a class="btn gray" href="admin-cms.html">Builder</a> <a class="btn gray" href="index.html">Voir le site</a></p><div class="tabs"><button class="btn tab active" data-tab="pages">Pages</button><button class="btn tab" data-tab="header">Header</button><button class="btn tab" data-tab="navigation">Navigation</button><button class="btn tab" data-tab="footer">Footer</button><button class="btn tab" data-tab="media">Médias</button><button class="btn tab" data-tab="seo">SEO</button></div><div id="panels"></div></div></section></main><script>let API='',AUTH='',files={};const $=x=>document.getElementById(x);async function call(path,opt={}){const r=await fetch(API.replace(/\/$/,'')+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+AUTH}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}async function login(){API=$("api").value.trim();try{const d=await call('/auth',{method:'POST',body:JSON.stringify({password:$("pass").value})});AUTH=d.token;$("login").classList.add('hidden');$("app").classList.remove('hidden');await loadAll()}catch(e){$("status").textContent='Connexion refusée : '+e.message}}async function loadAll(){for(const n of ['site-pages','header','navigation','footer','media','seo']){const path=n==='site-pages'?'data/site-pages.json':'data/cms-'+n+'.json';const d=await call('/file?path='+encodeURIComponent(path));files[n]={data:d.data,sha:d.sha,path:path}}render()}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function panel(n,t){return `<section class="panel" id="p-${n}"><h2>${t}</h2><p class="muted">Configuration complète de ${esc(files[n].path)}.</p><textarea class="area" id="j-${n}">${esc(JSON.stringify(files[n].data,null,2))}</textarea><p><button class="btn" onclick="saveJSON('${n}')">ENREGISTRER</button></p></section>`}function render(){const p=files['site-pages'].data,pages=p.pages||[];let h=`<section class="panel active" id="p-pages"><h2>Gestion des pages</h2><p class="muted">Activez/désactivez et modifiez les titres et URLs des pages.</p>${pages.map((x,i)=>`<div class="item"><b>${esc(x.id||'page')}</b><div class="grid"><div class="field"><label>Titre</label><input class="input pg-title" data-i="${i}" value="${esc(x.title||'')}"></div><div class="field"><label>URL</label><input class="input pg-slug" data-i="${i}" value="${esc(x.slug||'')}"></div></div><label><input type="checkbox" class="pg-enabled" data-i="${i}" ${x.enabled!==false?'checked':''}> Page active</label></div>`).join('')}<button class="btn" onclick="savePages()">ENREGISTRER LES PAGES</button></section>`;h+=panel('header','En-tête / identité')+panel('navigation','Navigation & réseaux')+panel('footer','Pied de page')+mediaPanel()+panel('seo','SEO & partage social');$("panels").innerHTML=h;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$("p-"+b.dataset.tab).classList.add('active');if(b.dataset.tab==='media')drawMedia()})}function mediaPanel(){return `<section class="panel" id="p-media"><h2>Bibliothèque médias</h2><div class="grid"><input id="mq" class="input" placeholder="Rechercher un média" oninput="drawMedia()"><button class="btn" onclick="addAsset()">+ AJOUTER UN MÉDIA</button></div><div id="mediaList" style="margin-top:15px"></div></section>`}function drawMedia(){const q=($("mq")?.value||'').toLowerCase(),a=(files.media.data.assets||[]).filter(x=>(x.title+' '+x.url+' '+(x.tags||[]).join(' ')).toLowerCase().includes(q));$("mediaList").innerHTML=a.map(x=>`<div class="asset"><img src="${esc(x.url||'')}" onerror="this.style.display='none'"><div><b>${esc(x.title||x.id)}</b><div class="muted">${esc(x.url||'URL non renseignée')} · ${esc(x.folder||'')}</div></div><button class="btn gray" onclick="copyURL('${esc(x.url||'')}')">Copier URL</button></div>`).join('')||'<p class="muted">Aucun média.</p>'}function addAsset(){const title=prompt('Nom du média ?');if(!title)return;const url=prompt('URL publique ?');if(!url)return;files.media.data.assets=files.media.data.assets||[];files.media.data.assets.push({id:'asset-'+Date.now(),title,url,type:'image',alt:title,folder:'news',tags:['news'],enabled:true});drawMedia();saveJSON('media')}async function copyURL(v){try{await navigator.clipboard.writeText(v);alert('URL copiée')}catch(_){prompt('Copiez',v)}}function savePages(){const p=files['site-pages'].data;document.querySelectorAll('.pg-title').forEach(e=>p.pages[+e.dataset.i].title=e.value);document.querySelectorAll('.pg-slug').forEach(e=>p.pages[+e.dataset.i].slug=e.value);document.querySelectorAll('.pg-enabled').forEach(e=>p.pages[+e.dataset.i].enabled=e.checked);saveFile('site-pages')}async function saveJSON(n){try{files[n].data=JSON.parse($("j-"+n).value);await saveFile(n);render()}catch(e){alert('JSON invalide : '+e.message)}}async function saveFile(n){const f=files[n],r=await call('/file',{method:'PUT',body:JSON.stringify({path:f.path,data:JSON.stringify(f.data,null,2),sha:f.sha,message:'admin: update CMS '+n})});f.sha=r.sha;$("status").textContent='Enregistré : '+f.path}</script></body></html>
