<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ciwara Infos — parution N°514 du vendredi 11 septembre 2026.">
<link rel="stylesheet" href="style.css?v=20260911">
<title>Ciwara Infos — N°514 | Radio Ciwara 105.5 FM</title>
<style>
.ci-page{background:#f4f4f2}.ci-hero{background:#111214;color:#fff;border-top:4px solid #d71920;border-bottom:4px solid #f7d51b;padding:28px 0}.ci-hero h1{font:900 clamp(28px,4vw,42px) Montserrat;margin:6px 0}.ci-hero p{margin:0;color:#ccc;font-size:12px}.ci-back{display:inline-block;margin:22px 0 14px;color:#d71920;font:900 10px Montserrat;text-decoration:none}.ci-cover{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:22px;box-shadow:0 8px 25px rgba(0,0,0,.07)}.ci-cover img{display:block;width:100%;max-height:360px;object-fit:cover}.ci-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.ci-card{background:#fff;border:1px solid #ddd;border-radius:9px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06);display:flex;flex-direction:column}.ci-image{height:190px;background:#17191b;position:relative}.ci-image img{width:100%;height:100%;object-fit:cover;display:block}.ci-image .fallback{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#151719,#087f44);color:#f7d51b;font:900 48px Montserrat}.ci-body{padding:17px;display:flex;flex-direction:column;flex:1}.ci-cat{font:900 8px Montserrat;color:#d71920;text-transform:uppercase}.ci-body h2{font:900 18px/1.25 Montserrat;margin:7px 0 8px}.ci-sub{font-size:12px;line-height:1.5;color:#666;margin:0 0 12px}.ci-meta{margin-top:auto;color:#888;font-size:9px}.ci-read{margin-top:13px;border:0;border-radius:5px;background:#111214;color:#fff;padding:11px;font:900 9px Montserrat;cursor:pointer}.ci-read:hover{background:#d71920}.empty{padding:25px;background:#fff;border:1px solid #ddd;border-radius:8px}.reader{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);padding:12px;overflow:auto}.reader.open{display:block}.reader-box{width:min(950px,100%);margin:20px auto;background:#fff;border-radius:10px;overflow:hidden}.reader-head{background:#111214;color:#fff;padding:20px;display:flex;justify-content:space-between;gap:15px}.reader-head h2{font:900 24px/1.2 Montserrat;margin:6px 0}.close{border:1px solid #555;background:transparent;color:#fff;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.reader-visual img{width:100%;max-height:440px;object-fit:cover;display:block}.reader-content{padding:25px}.reader-content .sub{color:#666;line-height:1.6}.reader-content p{font:400 17px/1.85 Georgia,serif;color:#222}.reader-foot{background:#f3f3f3;color:#777;padding:12px 20px;font-size:10px}@media(max-width:900px){.ci-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.ci-grid{grid-template-columns:1fr}.ci-image{height:200px}.reader{padding:5px}.reader-box{margin:5px auto}.reader-content{padding:20px}.reader-content p{font-size:15px}}
</style>
</head>
<body class="ci-page">
<header class="site-header"><div class="container nav-row"><a class="brand" href="index.html"><img src="logo.jpg" alt="Radio Ciwara"><span>RADIO<br><b>CIWARA</b><small>105.5 <i>FM</i></small></span></a><nav><a href="index.html">ACCUEIL</a><a class="active" href="ciwara-info.html">CIWARA INFO</a><a href="ciwara-tv.html">CIWARA TV</a><a href="download-app.html">APPLICATION</a></nav></div></header>
<section class="ci-hero"><div class="container"><span class="section-label" style="color:#f7d51b">JOURNAL ÉCRIT</span><h1 id="issueTitle">CIWARA INFOS — N°514</h1><p id="issueDate">Vendredi 11 septembre 2026</p></div></section>
<main class="section"><div class="container"><a class="ci-back" href="index.html">← RETOUR À L’ACCUEIL</a><div id="coverBox" class="ci-cover" hidden></div><div class="section-head"><div><span class="section-label">PARUTION</span><h2>Les 13 articles</h2></div></div><div id="grid" class="ci-grid"><div class="empty">Chargement de Ciwara Infos…</div></div></div></main>
<div id="reader" class="reader" aria-hidden="true"><div class="reader-box"><div class="reader-head"><div><span id="rCat" class="section-label" style="color:#f7d51b"></span><h2 id="rTitle"></h2></div><button id="close" class="close">×</button></div><div id="rVisual" class="reader-visual"></div><div class="reader-content"><p id="rSub" class="sub"></p><div id="rContent"></div></div><div id="rMeta" class="reader-foot"></div></div></div>
<footer><div class="container footer-bottom">© <span id="year"></span> Radio Ciwara 105.5 FM <a href="index.html">← Accueil</a></div></footer>
<script>
const grid=document.getElementById('grid'),reader=document.getElementById('reader');let items=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initials(v){return String(v||'CI').replace(/[^A-Za-zÀ-ÿ0-9 ]/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'CI'}
function imagePath(src){if(!src)return '';if(/^https?:\/\//i.test(src)||src.startsWith('data:'))return src;return src.replace(/^\.\//,'')}
function card(a,i){const src=imagePath(a.image);return `<article class="ci-card"><div class="ci-image">${src?`<img src="${esc(src)}" alt="${esc(a.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<div class="fallback" style="${src?'display:none':''}">${initials(a.category||a.title)}</div></div><div class="ci-body"><span class="ci-cat">${esc(a.category||'CIWARA INFOS')}</span><h2>${esc(a.title||'Article')}</h2><p class="ci-sub">${esc(a.subtitle||'')}</p><div class="ci-meta">${esc(a.author||'La rédaction')} · ${esc(a.date||'11 septembre 2026')}</div><button class="ci-read" data-i="${i}">LIRE L’ARTICLE →</button></div></article>`}
function openArticle(i){const a=items[i];if(!a)return;document.getElementById('rCat').textContent=a.category||'CIWARA INFOS';document.getElementById('rTitle').textContent=a.title||'';document.getElementById('rSub').textContent=a.subtitle||'';document.getElementById('rMeta').textContent=(a.author?a.author+' · ':'')+(a.date||'')+' · Ciwara Infos N°514';document.getElementById('rVisual').innerHTML=a.image?`<img src="${esc(imagePath(a.image))}" alt="${esc(a.title)}" onerror="this.remove()">`:'';document.getElementById('rContent').innerHTML=(a.content||[]).map(p=>`<p>${esc(p)}</p>`).join('');reader.classList.add('open');reader.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';history.replaceState(null,'',location.pathname+'#article-'+i)}
function closeArticle(){reader.classList.remove('open');reader.setAttribute('aria-hidden','true');document.body.style.overflow='';if(location.hash.startsWith('#article-'))history.replaceState(null,'',location.pathname)}
async function load(){try{const r=await fetch('data/ciwara-info.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Impossible de charger la parution');const d=await r.json();items=Array.isArray(d.items)?d.items:[];document.getElementById('issueTitle').textContent='CIWARA INFOS — '+(d.issue||'N°514');document.getElementById('issueDate').textContent=d.date||'';if(d.cover){document.getElementById('coverBox').hidden=false;document.getElementById('coverBox').innerHTML=`<img src="${esc(imagePath(d.cover))}" alt="Couverture ${esc(d.issue||'Ciwara Infos')}" onerror="this.parentElement.hidden=true">`}grid.innerHTML=items.length?items.map(card).join(''):'<div class="empty">Aucun article dans cette parution.</div>';grid.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openArticle(Number(b.dataset.i)));if(location.hash.startsWith('#article-'))openArticle(Number(location.hash.slice(9)))}catch(e){console.error(e);grid.innerHTML='<div class="empty">La parution ne peut pas être chargée pour le moment. Recharge la page après le déploiement.</div>'}}
document.getElementById('close').onclick=closeArticle;reader.addEventListener('click',e=>{if(e.target===reader)closeArticle()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeArticle()});document.getElementById('year').textContent=new Date().getFullYear();load();
</script></body></html>
