function toMin(v){const [h,m]=v.split(':').map(Number);return h*60+m}
function clean(s){return s.replace(/^\s*\/\s*/,'').trim()}
function getDaySchedule(day){return (schedule[day]||[]).map(x=>({start:x[0],end:x[1],name:clean(x[2])}));}
function findCurrent(now,day){const mins=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;const list=getDaySchedule(day);for(const x of list){let a=toMin(x.start),b=toMin(x.end);if(x.end==='00:00')b=1440;if(mins>=a&&mins<b)return x;}return null}
function findNext(now,day){const mins=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;const list=getDaySchedule(day);for(const x of list){if(toMin(x.start)>mins)return x;}return null}
function nextAcrossDays(now){for(let offset=1;offset<=7;offset++){const d=(now.getDay()+offset)%7;const list=getDaySchedule(d);if(list.length)return {item:list[0],days:offset};}return null}
function formatCountdown(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}h ${String(m).padStart(2,'0')}min`:m?`${m}min ${String(s).padStart(2,'0')}s`:`${s}s`}
function setText(id,text){document.getElementById(id).textContent=text}
function update(){
 const now=new Date();
 const day=now.getDay();
 const cur=findCurrent(now,day);
 let next=findNext(now,day), nextDate=new Date(now);
 if(!next){const across=nextAcrossDays(now);if(across){next=across.item;nextDate.setDate(nextDate.getDate()+across.days);} }
 if(cur){
   setText('currentShow',cur.name);setText('currentHost','RADIO CIWARA · 105.5 FM');setText('start',cur.start);setText('end',cur.end);
   let start=toMin(cur.start), end=cur.end==='00:00'?1440:toMin(cur.end), nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
   document.getElementById('progress').style.width=Math.max(2,Math.min(100,((nowMin-start)/(end-start))*100))+'%';
   if(next){setText('nextShow',next.name);setText('nextHost','Prochaine émission · grille officielle 2026');setText('nextTime',next.start);let nextM=toMin(next.start);if(nextDate.getHours()===0&&next.start==='00:00')nextM=0;let target=new Date(nextDate);target.setHours(Math.floor(nextM/60),nextM%60,0,0);setText('countdown','À suivre dans '+formatCountdown((target-now)/1000));}
 }else{
   setText('currentShow','Hors créneau programmé');setText('currentHost','RADIO CIWARA · 105.5 FM');setText('start','--:--');setText('end','--:--');document.getElementById('progress').style.width='0%';

 }
}
