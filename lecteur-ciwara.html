<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecteur Radio Ciwara</title><style>body{margin:0;font-family:Arial,sans-serif;background:#07182d;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.card{border-radius:18px;background:linear-gradient(135deg,#07182d,#102d4b);padding:20px;box-shadow:0 12px 35px #0006;border:1px solid #ffffff18}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.live{background:#e81e4d;border-radius:999px;padding:7px 12px;font-weight:700;font-size:12px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#9eb5ca}.show{font-size:clamp(20px,4vw,32px);font-weight:800;margin:6px 0}.host{color:#b9c9d8}.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:15px;font-size:13px}.bar{height:6px;background:#ffffff18;border-radius:8px;margin:16px 0}.fill{height:100%;width:0;background:#e81e4d;border-radius:8px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:14px}.next{font-size:13px;color:#b9c9d8}.next b{color:#fff}.listen{border:0;background:#e81e4d;color:#fff;padding:13px 18px;border-radius:12px;font-weight:800;cursor:pointer}.listen:hover{filter:brightness(1.1)}@media(max-width:600px){.bottom{align-items:stretch;flex-direction:column}.listen{width:100%}}</style></head><body><div class="wrap"><div class="card"><div class="top"><div class="eyebrow">RADIO CIWARA 105.5 FM · VOUS ÉCOUTEZ MAINTENANT</div><div class="live">● EN DIRECT</div></div><div class="show" id="show">Chargement du programme…</div><div class="host" id="host"></div><div class="meta"><span id="time"></span><span id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="bottom"><div class="next" id="next"></div><button class="listen" onclick="goLive()">▶ ÉCOUTER EN DIRECT</button></div></div></div><script>
const schedule=[
['06:45','07:00','Ouverture D’antenne'],['07:00','08:00','Tour d’Horizon'],['08:00','09:00','Ciwara Matin'],['09:00','09:05','Flash Infos de la radio Ciwara'],['09:05','10:00','Musiques - Annonces et Publicités'],['10:00','11:30','Revue de la Presse – Gaffé – Commentaire des articles de presses'],['11:30','13:00','Baroni Sensibilisation'],['13:00','14:00','Maana'],['14:00','14:05','Flash Ciwara FM'],['14:05','15:00','Programme de l’après-midi'],['15:00','16:00','Programme de l’après-midi'],['16:00','17:00','Programme musical'],['17:00','18:00','Ciwara Love'],['18:00','18:15','Grand Journal de la radio Ciwara FM 105.50'],['18:15','19:00','Baroni Sensibilisation'],['19:00','20:00','Rediffusion Revue de la Presse – Gaffé – Commentaire des articles de presses'],['20:00','21:00','Programme du soir'],['21:00','22:00','Programme du soir'],['22:00','23:00','Programme du soir'],['23:00','00:00','Programme du soir'],['00:00','01:00','Programme de nuit']
];
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
function m(s){let [h,x]=s.split(':').map(Number);return h*60+x}
function find(){let n=nowMin();for(let i=0;i<schedule.length;i++){let a=m(schedule[i][0]),b=m(schedule[i][1]);if(b===0)b=1440;if(n>=a&&n<b)return [i,schedule[i],a,b,n]}return null}
function render(){let r=find();if(!r){document.getElementById('show').textContent='Hors créneau programmé';document.getElementById('host').textContent='Radio Ciwara 105.5 FM';return}let [i,s,a,b,n]=r;document.getElementById('show').textContent=s[2];document.getElementById('host').textContent='Radio Ciwara 105.5 FM';document.getElementById('time').textContent=s[0]+' — '+s[1];let pct=Math.max(0,Math.min(100,(n-a)/(b-a)*100));document.getElementById('fill').style.width=pct+'%';let next=schedule[(i+1)%schedule.length];document.getElementById('next').innerHTML='À SUIVRE : <b>'+next[2]+'</b> · '+next[0];let left=Math.max(0,Math.round(b-n));document.getElementById('count').textContent='Fin dans '+Math.floor(left/60)+'h '+String(left%60).padStart(2,'0')+'min'}
function goLive(){const p=window.parent&&window.parent!==window?window.parent.document:document;const el=p.querySelector('.caster-main-player,.ciwara-caster-card');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='3px solid #e81e4d';setTimeout(()=>el.style.outline='',2200)}else if(window.parent&&window.parent!==window){window.parent.location.hash='direct'}}render();setInterval(render,1000);
</script></body></html>
