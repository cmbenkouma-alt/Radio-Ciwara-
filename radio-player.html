<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio Ciwara — Lecteur officiel</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#120108;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.cstrEmbed{width:100%;min-height:230px}
a{color:#fff}
</style>
</head>
<body>
<div class="wrap">
<div class="cstrEmbed" data-type="newStreamPlayer" data-publicToken="236f6884-9ad2-465f-a29e-5f349a8dac8e" data-theme="light" data-color="D4145A" data-channelId="" data-rendered="false">
<a href="https://www.caster.fm">Radio Server Hosting</a>
</div>
</div>
<script src="https://cdn.cloud.caster.fm/widgets/embed.js"></script>
<script>
(function(){
  let attempts=0;
  const timer=setInterval(function(){
    attempts++;
    const root=document.querySelector('.cstrEmbed');
    const player=root&&root.querySelector('iframe,audio,button,[role="button"],input');
    if(player){
      clearInterval(timer);
      if(window.casterStatus) window.casterStatus.postMessage('ready');
    } else if(attempts>=20){
      clearInterval(timer);
      if(window.casterStatus) window.casterStatus.postMessage('failed');
    }
  },500);
})();
</script>
</body>
</html>
