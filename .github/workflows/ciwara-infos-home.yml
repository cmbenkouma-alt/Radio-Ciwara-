name: Ciwara Infos — nettoyage de l’accueil

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/ciwara-infos-home.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ciwara-infos-home
  cancel-in-progress: true

jobs:
  remove-home-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Supprimer le bloc Ciwara Infos de l’accueil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start_marker = '<!-- CIWARA-INFOS-HOME:START -->'
          end_marker = '<!-- CIWARA-INFOS-HOME:END -->'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start >= 0 and end >= 0:
              end += len(end_marker)
              text = text[:start] + text[end:]
              p.write_text(text, encoding='utf-8')
              print('Bloc Ciwara Infos supprimé.')
          else:
              print('Bloc déjà absent.')
          PY

      - name: Enregistrer la suppression
        run: |
          if git diff --quiet -- index.html; then
            echo 'Aucune modification nécessaire.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Supprimer le bloc Ciwara Infos de l’accueil'
          git push
