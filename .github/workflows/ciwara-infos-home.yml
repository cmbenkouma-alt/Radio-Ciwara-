name: Nettoyage accueil Ciwara

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/ciwara-infos-home.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ciwara-home-cleanup
  cancel-in-progress: true

jobs:
  cleanup-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nettoyer l’accueil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          changed = False

          # Supprimer le bloc Ciwara Infos injecté précédemment.
          start_marker = '<!-- CIWARA-INFOS-HOME:START -->'
          end_marker = '<!-- CIWARA-INFOS-HOME:END -->'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start >= 0 and end >= 0:
              end += len(end_marker)
              text = text[:start] + text[end:]
              changed = True

          # Supprimer entièrement la bannière Dolo Karamoko sous « Réécoutez Ciwara ».
          start = text.find('<section class="bank-ad">')
          if start >= 0:
              end = text.find('</section>', start)
              if end >= 0:
                  end += len('</section>')
                  text = text[:start] + text[end:]
                  changed = True

          p.write_text(text, encoding='utf-8')
          print('Accueil nettoyé.' if changed else 'Aucune modification nécessaire.')
          PY

      - name: Enregistrer le nettoyage
        run: |
          if git diff --quiet -- index.html; then
            echo 'Accueil déjà nettoyé.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Supprimer le bloc Ciwara Infos et la bannière Dolo Karamoko'
          git push
