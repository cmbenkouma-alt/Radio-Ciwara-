name: Ajouter Hit Radio au portail Ciwara

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hitradio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajouter les flux Hit Radio vérifiés
        env:
          LOGO: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAlzzmnLF5MQ9KtyYCvFIxyNOpF3X6hPcMH5skh43UYg&s"
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          p = Path('mali-radios-original.js')
          s = p.read_text(encoding='utf-8')
          logo = os.environ['LOGO']

          # Le bloc Maroc existe déjà. On ajoute uniquement les flux africains
          # dont une URL de streaming directe a été identifiée de façon fiable.
          additions = """
          {name:'HIT RADIO Togo',frequency:'Lomé · 104.7 FM · Afrique',stream:'https://hr-togo.ice.infomaniak.ch/hr-togo-64.aac',logo:'LOGO'},
          """.replace('LOGO', logo).strip()

          if "name:'HIT RADIO Togo'" not in s:
              pos = s.find('\n];')
              if pos == -1:
                  raise SystemExit('Tableau stations introuvable')
              s = s[:pos] + ',\n' + additions + s[pos:]
              p.write_text(s, encoding='utf-8')
              print('Flux HIT RADIO Togo ajouté')
          else:
              print('Flux HIT RADIO Togo déjà présent')
          PY

      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mali-radios-original.js
          git diff --cached --quiet && exit 0
          git commit -m "Ajoute le flux HIT RADIO Togo"
          git push
