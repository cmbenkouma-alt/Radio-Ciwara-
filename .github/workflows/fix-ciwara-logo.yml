name: Fix Ciwara Infos logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-logo:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Ciwara Infos logo display') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<style id="ciwara-infos-brand-fix">
          .brand-pair{display:flex;align-items:center;gap:16px;min-width:0;flex-shrink:0}.brand-pair .brand{min-width:245px}.ciwara-infos-brand{display:flex;align-items:center;justify-content:center;width:170px;height:58px;overflow:hidden;border-left:1px solid #e4e4e4;padding-left:14px;box-sizing:border-box;flex-shrink:0}.ciwara-infos-brand img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;transform:none}.ciwara-infos-brand:hover{opacity:.9}@media(max-width:900px){.brand-pair{width:100%;justify-content:space-between}.brand-pair .brand{min-width:0}.ciwara-infos-brand{width:145px;height:52px;padding-left:8px}}@media(max-width:650px){.brand-pair{gap:7px}.brand-pair .brand img{width:48px;height:auto}.brand-pair .brand span{font-size:11px}.brand-pair .brand small{font-size:8px}.ciwara-infos-brand{width:120px;height:42px;padding-left:6px}.ciwara-infos-brand img{width:100%;height:100%;object-fit:contain;object-position:center;transform:none}}
          </style>'''.replace('\n          ', '\n')
          new = '''<style id="ciwara-infos-brand-fix">
          .brand-pair{display:flex;align-items:center;gap:16px;min-width:0;flex-shrink:0}.brand-pair .brand{min-width:245px}.ciwara-infos-brand{display:flex;align-items:center;justify-content:center;width:170px;min-width:170px;height:58px;overflow:visible;border-left:1px solid #e4e4e4;padding-left:14px;box-sizing:border-box;flex-shrink:0}.ciwara-infos-brand img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center;transform:none}.ciwara-infos-brand:hover{opacity:.9}@media(max-width:900px){.brand-pair{width:100%;justify-content:space-between}.brand-pair .brand{min-width:0}.ciwara-infos-brand{width:145px;min-width:145px;height:52px;padding-left:8px}}@media(max-width:650px){.brand-pair{gap:7px}.brand-pair .brand img{width:48px;height:auto}.brand-pair .brand span{font-size:11px}.brand-pair .brand small{font-size:8px}.ciwara-infos-brand{width:120px;min-width:120px;height:42px;padding-left:6px}.ciwara-infos-brand img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center;transform:none}}
          </style>'''.replace('\n          ', '\n')
          if old not in s:
              raise SystemExit('Target CSS block not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Ciwara Infos logo display without clipping"
          git push
