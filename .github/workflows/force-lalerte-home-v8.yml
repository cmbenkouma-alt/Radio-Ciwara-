name: Refresh mixed press homepage runtime
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-lalerte-home-v8.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point homepage to current mixed press runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/js/lalerte-home.js?v=20260915-7'
          new = 'assets/js/lalerte-home.js?v=20260915-8'
          if new not in s:
              s = s.replace(old, new)
          if new not in s:
              s = s.replace('</body>', '<script src="assets/js/lalerte-home.js?v=20260915-8"></script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage runtime refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: load refreshed mixed press runtime" && git push)