name: Sync Radio Ciwara news

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-foundation
        uses: actions/checkout@v4
        with:
          ref: app-foundation

      - name: Fetch Maliweb and Malijet RSS
        run: python3 tools/fetch_news.py

      - name: Commit updated news cache
        run: |
          git config user.name "radio-ciwara-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "chore(news): refresh Mali news cache"
            git push origin HEAD:app-foundation
          fi
