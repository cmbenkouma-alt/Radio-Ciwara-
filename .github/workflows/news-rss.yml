name: Radio Ciwara - Actualités RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Synchroniser les flux
        run: python tools/fetch_news.py
      - name: Publier le cache JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/ciwara-info.json
          if git diff --cached --quiet; then echo "Aucune modification."; exit 0; fi
          git commit -m "chore: synchroniser les actualites RSS"
          git push origin main
