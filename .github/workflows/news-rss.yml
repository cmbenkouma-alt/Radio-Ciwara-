name: Radio Ciwara - Actualités RSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/rss_news.py'
      - '.github/workflows/news-rss.yml'
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Synchroniser Malijet + Maliweb
        run: python scripts/rss_news.py
      - name: Publier le cache JSON et les images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news-images/
          if git diff --cached --quiet; then echo "Aucune modification."; exit 0; fi
          git commit -m "chore: synchroniser les actualites RSS et leurs images"
          git push origin main