name: Ajuster uniquement Djigué & Co
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-djigue.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ajuster le cadrage de Djigué & Co
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="ciwara-djigue-fit">'
          if marker not in s:
              css = '''<style id="ciwara-djigue-fit">
          .portal-ad-djigue{padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;background:#fff!important;box-sizing:border-box!important}
          .portal-ad-djigue img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;display:block!important}
          @media(max-width:900px){.portal-ad-djigue{height:72px!important;min-height:72px!important}.portal-ad-djigue img{width:100%!important;height:100%!important;object-fit:contain!important}}
          </style>'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Enregistrer et supprimer le workflow temporaire
        run: |
          rm -f .github/workflows/fix-djigue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-djigue.yml
          git diff --cached --quiet || git commit -m "Ajuster le cadrage de la bannière Djigué & Co"
          git push