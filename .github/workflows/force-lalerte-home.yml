name: Point homepage to mixed LALERTE script

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-lalerte-home.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure mixed LALERTE homepage runtime is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/lalerte-home.js?v=20260915-7"></script>'
          if 'assets/js/lalerte-home.js?v=20260915-7' not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit homepage runtime reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: load mixed Ciwara Infos and LALERTE homepage block" && git push)
