name: Restore Caster.fm hero player

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-hero-caster:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore only the hero Caster.fm block
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pattern = r'<section class="hero ciwara-hero" id="direct">.*?</section>'
          replacement = '''<section class="hero ciwara-hero" id="direct"><div class="hero-bg"></div><div class="container hero-grid"><div class="hero-copy ciwara-hero-video-col"><p class="kicker">RADIO CIWARA 105.5 FM</p><div class="ciwara-youtube-frame"><iframe src="https://www.youtube.com/embed/lcSEEc1-YpU?rel=0&modestbranding=1" title="Ciwara TV — vidéo" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="ciwara-hero-caption">CIWARA TV · Retrouvez nos contenus vidéo</p></div><div class="hero-player ciwara-caster-card"><div class="player-title"><b>ÉCOUTER RADIO CIWARA 105.5 FM</b><span>● LIVE</span></div><div class="direct-player caster-main-player"><div data-type="newStreamPlayer" data-publicToken="236f6884-9ad2-465f-a29e-5f349a8dac8e" data-theme="light" data-color="e81e4d" data-channelId="a27e1e52-bcc3-4ee8-9b8d-8bce0f345b47" data-rendered="false" class="cstrEmbed"><a href="https://www.caster.fm">Shoutcast Hosting</a> <a href="https://www.caster.fm">Stream Hosting</a> <a href="https://www.caster.fm">Radio Server Hosting</a></div></div></div></div></section>'''

          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Hero section not found; no change made.')

          # Safety checks: keep the bottom Caster player absent.
          if 'caster-bottom-widget' in s2 or 'newStreamPlayer' not in s2:
              raise SystemExit('Safety check failed.')

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-hero-caster.yml
          git commit -m "fix: restore Caster.fm player in hero only"
          git push origin main
