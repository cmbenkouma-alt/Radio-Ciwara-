name: Remove Artist du mois box once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-artist-box:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the Astan Kida homepage box
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<a\s+aria-label="Artiste du mois : Astan Kida"\s+class="artist-month-box"\s+href="artiste-du-mois\.html">.*?</a>'
          new, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Artist box not found exactly once (matches={n}); no change made')
          p.write_text(new, encoding='utf-8')
          print('Removed Astan Kida artist-month box:', n)
          PY
      - name: Commit removal and delete this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-artist-month-once.yml
          git add index.html
          git commit -m 'chore: remove Astan Kida artist month box'
          git push
