name: Restore index and fix Astan Kida

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index from known good blob and fix image path
        shell: bash
        run: |
          curl -fsSL https://api.github.com/repos/cmbenkouma-alt/Radio-Ciwara-/git/blobs/04977947fbe58f1a1793a614ef12da9c45fe8a57 | python -c "import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode('utf-8'), end='')" > index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="/assets/artistes/astan-kida-artiste-du-mois.png?v=20260914"', 'src="assets/artistes/astan-kida-artiste-du-mois.png?v=20260914"')
          p.write_text(s, encoding='utf-8')
          PY
          test "$(wc -c < index.html)" -gt 10000
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-astan-index.yml
          git add index.html
          git commit -m "Restore complete homepage index and fix Astan Kida image path"
          git push
