name: Déployer API Admin Ciwara

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/admin-api.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-admin-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.44.0

      - name: Déployer le Worker Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Vérifier la santé du Worker
        run: |
          set -e
          response=""
          for i in 1 2 3 4 5; do
            response=$(curl -fsS https://radio-ciwara-admin-api.cmbenkouma.workers.dev/health) && break || true
            sleep 5
          done
          echo "$response"
          echo "$response" | grep -q '"ok":true'
