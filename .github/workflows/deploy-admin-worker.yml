name: Déployer API Admin Ciwara

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/admin-api.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-admin-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.44.0

      - name: Vérifier la configuration Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          test -n "$CF_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN manquant dans GitHub Actions."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID manquant dans GitHub Actions (Secret ou Variable)."; exit 1; }
          echo "Configuration Cloudflare détectée."

      - name: Déployer le Worker Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --account-id "$CLOUDFLARE_ACCOUNT_ID"

      - name: Vérifier la santé du Worker
        run: |
          set -e
          response=""
          for i in 1 2 3 4 5; do
            response=$(curl -fsS https://radio-ciwara-admin-api.cmbenkouma.workers.dev/health) && break || true
            sleep 5
          done
          echo "$response"
          echo "$response" | grep -q '"ok":true'
