name: Mettre à jour automatiquement la vidéo ORTM

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ortm:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Détecter le dernier journal télévisé ORTM
        id: latest
        env:
          ORTM_CHANNEL_ID: UCQhdHZkL2eOBu66gNMCawag
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          channel = os.environ['ORTM_CHANNEL_ID']
          url = f'https://www.youtube.com/feeds/videos.xml?channel_id={channel}'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = urllib.request.urlopen(req, timeout=20).read()
          root = ET.fromstring(data)
          ns = {
              'yt': 'http://www.youtube.com/xml/schemas/2015',
              'atom': 'http://www.w3.org/2005/Atom'
          }

          journal_re = re.compile(
              r'(journal\s+t[ée]l[ée]vis[ée]|\bjt\b|\b20h\b|\b13h\b|\b23h30\b|\b19h30\b|\b18h30\b|don\s+kibaru|kibaru)',
              re.IGNORECASE
          )

          entries = root.findall('atom:entry', ns)
          match = None
          for entry in entries:
              title = (entry.findtext('atom:title', namespaces=ns) or '').strip()
              if journal_re.search(title):
                  match = entry
                  break

          if match is None:
              raise SystemExit('Aucun nouveau journal télévisé ORTM trouvé dans le flux récent.')

          video_id = match.findtext('yt:videoId', namespaces=ns)
          title = match.findtext('atom:title', namespaces=ns) or 'Journal télévisé ORTM'
          published = match.findtext('atom:published', namespaces=ns) or ''

          if not video_id:
              raise SystemExit('ID vidéo introuvable.')

          print('JT ORTM détecté :', title)
          print('Publié :', published)
          print('ID vidéo :', video_id)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'video_id={video_id}\n')
              f.write('title<<EOF\n')
              f.write(title.replace('\n', ' ') + '\n')
              f.write('EOF\n')
          PY

      - name: Mettre à jour le bloc ORTM
        env:
          VIDEO_ID: ${{ steps.latest.outputs.video_id }}
          VIDEO_TITLE: ${{ steps.latest.outputs.title }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('mali-radios.js')
          s = p.read_text(encoding='utf-8')
          new_url = 'https://www.youtube.com/live/' + os.environ['VIDEO_ID']

          s2, count = re.subn(
              r'https://www\.youtube\.com/live/[A-Za-z0-9_-]+',
              new_url,
              s
          )

          if count == 0:
              raise SystemExit('Lien ORTM actuel introuvable dans mali-radios.js')

          p.write_text(s2, encoding='utf-8')
          print('Bloc ORTM :', os.environ['VIDEO_TITLE'])
          print('Nouveau lien :', new_url)
          PY

      - name: Ajouter l'aperçu automatique de la vidéo ORTM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mali-radios.js')
          s = p.read_text(encoding='utf-8')

          marker = 'function ortmPreview(){'
          if marker not in s:
              code = r'''function ortmPreview(){
          document.querySelectorAll('.mali-ortm-link').forEach(a=>{
            const m=(a.href||'').match(/\/live\/([A-Za-z0-9_-]+)/);
            if(!m)return;
            const id=m[1];
            const thumb='https://i.ytimg.com/vi/'+id+'/hqdefault.jpg';
            const fallback='https://upload.wikimedia.org/wikipedia/commons/7/7c/ORTM_1_0.png';
            a.style.backgroundImage="linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.08) 58%),url('"+thumb+"'),url('"+fallback+"')";
            a.style.backgroundSize='cover,cover,contain';
            a.style.backgroundPosition='center,center,center';
            a.style.backgroundRepeat='no-repeat';
            a.classList.add('has-ortm-preview');
          });
          }
          '''
              s=s.replace('function start(){',code+'function start(){')

          s=s.replace("function start(){init();setTimeout(player,700)}", "function start(){init();setTimeout(ortmPreview,120);setTimeout(player,700)}")

          css_marker='.mali-ortm-link{position:relative;'
          if css_marker in s and 'has-ortm-preview' not in s:
              s=s.replace(css_marker, ".mali-ortm-link.has-ortm-preview:before{background:rgba(215,25,32,.95)}\\n"+css_marker)

          p.write_text(s, encoding='utf-8')
          print('Aperçu ORTM automatique installé.')
          PY

      - name: Publier uniquement si le code ORTM a changé
        run: |
          if git diff --quiet -- mali-radios.js; then
            echo 'Aucun changement à publier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mali-radios.js
          git commit -m 'Afficher automatiquement la miniature du JT ORTM'
          git push
