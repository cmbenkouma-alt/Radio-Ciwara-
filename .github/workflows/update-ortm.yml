name: Mettre à jour automatiquement la vidéo ORTM

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ortm:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Détecter le dernier journal télévisé ORTM
        id: latest
        env:
          ORTM_CHANNEL_ID: UCQhdHZkL2eOBu66gNMCawag
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          channel = os.environ['ORTM_CHANNEL_ID']
          url = f'https://www.youtube.com/feeds/videos.xml?channel_id={channel}'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          data = urllib.request.urlopen(req, timeout=20).read()
          root = ET.fromstring(data)
          ns = {
              'yt': 'http://www.youtube.com/xml/schemas/2015',
              'atom': 'http://www.w3.org/2005/Atom'
          }

          # Le flux contient les dernières vidéos de la chaîne. On ne prend
          # que les titres correspondant à un journal télévisé ORTM.
          journal_re = re.compile(
              r'(journal\s+t[ée]l[ée]vis[ée]|\bjt\b|\b20h\b|\b13h\b|\b23h30\b|\b19h30\b|\b18h30\b|don\s+kibaru|kibaru)',
              re.IGNORECASE
          )

          entries = root.findall('atom:entry', ns)
          match = None
          for entry in entries:
              title = (entry.findtext('atom:title', namespaces=ns) or '').strip()
              if journal_re.search(title):
                  match = entry
                  break

          if match is None:
              raise SystemExit('Aucun nouveau journal télévisé ORTM trouvé dans le flux récent.')

          video_id = match.findtext('yt:videoId', namespaces=ns)
          title = match.findtext('atom:title', namespaces=ns) or 'Journal télévisé ORTM'
          published = match.findtext('atom:published', namespaces=ns) or ''

          if not video_id:
              raise SystemExit('ID vidéo introuvable.')

          print('JT ORTM détecté :', title)
          print('Publié :', published)
          print('ID vidéo :', video_id)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'video_id={video_id}\n')
              f.write('title<<EOF\n')
              f.write(title.replace('\n', ' ') + '\n')
              f.write('EOF\n')

          PY

      - name: Mettre à jour le bloc ORTM
        env:
          VIDEO_ID: ${{ steps.latest.outputs.video_id }}
          VIDEO_TITLE: ${{ steps.latest.outputs.title }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('mali-radios.js')
          s = p.read_text(encoding='utf-8')
          new_url = 'https://www.youtube.com/live/' + os.environ['VIDEO_ID']

          # Remplace uniquement l'URL du JT dans le bloc ORTM.
          s2, count = re.subn(
              r'https://www\.youtube\.com/live/[A-Za-z0-9_-]+',
              new_url,
              s
          )

          if count == 0:
              raise SystemExit('Lien ORTM actuel introuvable dans mali-radios.js')

          if s2 == s:
              print('Le bloc ORTM pointe déjà vers :', os.environ['VIDEO_TITLE'])
          else:
              p.write_text(s2, encoding='utf-8')
              print('Bloc ORTM mis à jour :', os.environ['VIDEO_TITLE'])
              print('Nouveau lien :', new_url)
          PY

      - name: Publier uniquement si la vidéo a changé
        run: |
          if git diff --quiet -- mali-radios.js; then
            echo 'Aucun changement : le site conserve la vidéo ORTM actuelle.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mali-radios.js
          git commit -m 'Mise à jour automatique du JT ORTM'
          git push
