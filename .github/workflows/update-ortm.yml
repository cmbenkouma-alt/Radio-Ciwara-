name: Mettre à jour automatiquement la vidéo ORTM

on:
  push:
    branches: [main]
    paths:
      - 'mali-radios-original.js'
      - '.github/workflows/update-ortm.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ortm
  cancel-in-progress: true

jobs:
  update-ortm:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Détecter la dernière vidéo ORTM
        id: latest
        env:
          ORTM_CHANNEL_ID: UCQhdHZkL2eOBu66gNMCawag
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          channel = os.environ['ORTM_CHANNEL_ID']
          url = f'https://www.youtube.com/feeds/videos.xml?channel_id={channel}'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept': 'application/atom+xml,application/xml,text/xml;q=0.9,*/*;q=0.8',
          }

          data = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                  if data:
                      break
              except Exception as exc:
                  last_error = exc
                  print(f'Tentative {attempt}/3 échouée: {exc}')
                  if attempt < 3:
                      time.sleep(5)

          if not data:
              raise SystemExit(f'Flux YouTube ORTM inaccessible après 3 tentatives: {last_error}')

          root = ET.fromstring(data)
          ns = {'yt': 'http://www.youtube.com/xml/schemas/2015', 'atom': 'http://www.w3.org/2005/Atom'}
          entries = root.findall('atom:entry', ns)
          if not entries:
              raise SystemExit('Le flux ORTM est accessible mais ne contient aucune vidéo.')

          journal_re = re.compile(r'(journal|\bjt\b|\b20h\b|\b13h\b|\b23h30\b|\b19h30\b|\b18h30\b|kibaru|édition|edition)', re.IGNORECASE)
          match = next((e for e in entries if journal_re.search((e.findtext('atom:title', namespaces=ns) or '').strip())), entries[0])

          video_id = (match.findtext('yt:videoId', namespaces=ns) or '').strip()
          title = (match.findtext('atom:title', namespaces=ns) or 'Journal ORTM').strip()
          published = (match.findtext('atom:published', namespaces=ns) or '').strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]{6,20}', video_id):
              raise SystemExit(f'ID vidéo ORTM invalide: {video_id!r}')

          print('Vidéo ORTM détectée :', title)
          print('Publié :', published)
          print('ID vidéo :', video_id)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'video_id={video_id}\n')
              f.write('title<<EOF\n')
              f.write(title.replace('\n', ' ') + '\n')
              f.write('EOF\n')
          PY

      - name: Mettre à jour le vrai lecteur ORTM
        env:
          VIDEO_ID: ${{ steps.latest.outputs.video_id }}
          VIDEO_TITLE: ${{ steps.latest.outputs.title }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          # Le box ORTM est généré dans mali-radios-original.js.
          # mali-radios.js n'est qu'un wrapper : ne plus modifier le mauvais fichier.
          p = Path('mali-radios-original.js')
          s = p.read_text(encoding='utf-8')
          video_id = os.environ['VIDEO_ID']
          new_url = 'https://www.youtube.com/live/' + video_id

          marker = 'mali-ortm-link'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('Box .mali-ortm-link introuvable dans mali-radios-original.js')

          start = s.rfind('<div class=\\"mali-ortm-block\\"', 0, pos)
          if start < 0:
              start = s.rfind('<div class="mali-ortm-block"', 0, pos)
          if start < 0:
              raise SystemExit('Conteneur .mali-ortm-block introuvable.')

          end = s.find('</div></div></div>', pos)
          if end < 0:
              raise SystemExit('Fin du box ORTM introuvable.')
          end += len('</div></div></div>')

          block = s[start:end]
          youtube_re = re.compile(r'https://(?:www\\.)?youtube\\.com/(?:live/|watch\\?v=|embed/)[A-Za-z0-9_-]+')
          block2, count = youtube_re.subn(new_url, block)
          if count < 1:
              raise SystemExit('Aucun lien YouTube trouvé dans le box ORTM.')

          p.write_text(s[:start] + block2 + s[end:], encoding='utf-8')
          print('Lecteur ORTM mis à jour :', VIDEO_TITLE)
          print('URL :', new_url)
          PY

      - name: Vérifier le lecteur ORTM
        env:
          VIDEO_ID: ${{ steps.latest.outputs.video_id }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          s = Path('mali-radios-original.js').read_text(encoding='utf-8')
          pos = s.find('mali-ortm-link')
          if pos < 0:
              raise SystemExit('Box ORTM introuvable après mise à jour.')
          block_start = s.rfind('mali-ortm-block', 0, pos)
          block = s[max(0, block_start):pos+2500]
          expected = os.environ['VIDEO_ID']
          if expected not in block:
              raise SystemExit(f'Le nouvel ID ORTM {expected} n’est pas présent dans le box.')
          print('Vérification ORTM OK :', expected)
          PY

      - name: Publier uniquement si le lecteur a changé
        run: |
          if git diff --quiet -- mali-radios-original.js; then
            echo 'Aucun changement ORTM à publier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mali-radios-original.js
          git commit -m 'Mettre à jour automatiquement le lecteur ORTM'
          git push
