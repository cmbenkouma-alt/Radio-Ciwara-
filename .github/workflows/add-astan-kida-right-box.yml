name: Add Astan Kida sidebar box

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-astan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert new Astan Kida box
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="ciwara-astan-kida-new-box"' in s:
              print('Already installed')
              raise SystemExit(0)
          block = r'''\n<style id="ciwara-astan-kida-new-style">\n.ciwara-astan-kida-new{background:#fff;border:1px solid #ddd;border-radius:6px;overflow:hidden;box-sizing:border-box}.ciwara-astan-kida-new a{display:block;color:inherit;text-decoration:none}.ciwara-astan-kida-new .title{padding:12px 14px;border-top:4px solid var(--ci-red);font:900 11px Montserrat;color:#111}.ciwara-astan-kida-new .poster{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;object-position:center;background:#fff}.ciwara-astan-kida-new .caption{padding:9px 12px 11px;font:800 10px/1.25 Montserrat;color:#222;text-align:center;border-top:1px solid #eee}.ciwara-astan-kida-new .caption small{display:block;margin-top:3px;font:600 9px Roboto;color:#777}@media(max-width:900px){.ciwara-astan-kida-new .poster{aspect-ratio:1/1}}\n</style>\n<div id="ciwara-astan-kida-new-box" class="ciwara-astan-kida-new" aria-label="Astan Kida artiste du mois"><a href="artiste-du-mois.html"><div class="title">ARTISTE À L’HONNEUR</div><img class="poster" src="assets/artistes/astan-kida-artiste-du-mois.png" alt="Astan Kida — artiste à l’honneur"><div class="caption">ASTAN KIDA<small>Artiste à l’honneur</small></div></a></div>\n'''
          marker = '</body>'
          if marker not in s:
              raise SystemExit('No body marker')
          # Insert via a tiny runtime hook so the box lands exactly between the radio list and ORTM box.
          hook = r'''\n<script id="ciwara-astan-kida-new-script">\n(()=>{const add=()=>{const ortm=document.querySelector('.mali-ortm-block');if(!ortm||document.getElementById('ciwara-astan-kida-new-box'))return false;const wrap=document.createElement('div');wrap.innerHTML=`''' + block.replace('`','\\`') + r'''`;const box=wrap.firstElementChild;ortm.parentNode.insertBefore(box,ortm);return true};if(!add()){const o=new MutationObserver(()=>{if(add())o.disconnect()});o.observe(document.body,{childList:true,subtree:true});setTimeout(()=>o.disconnect(),15000)}})();\n</script>\n'''
          s = s.replace(marker, hook + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'ciwara-astan-kida-new-box' in s
          assert 'assets/artistes/astan-kida-artiste-du-mois.png' in s
          assert '.mali-ortm-block' in s
          print('Astan Kida integration present')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: add new Astan Kida sidebar box'
          git push
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/add-astan-kida-right-box.yml || true
          git commit -m 'chore: remove one-time Astan Kida workflow' || true
          git push || true
