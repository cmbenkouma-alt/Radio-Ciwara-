name: Isolate Astan Kida sidebar card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Astan Kida card only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_card = '''<a class="artist-month-box" href="artiste-du-mois.html" aria-label="Artiste du mois : Astan Kida">
  <div class="artist-month-photo"><img src="assets/artistes/astan-kida.jpg?v=20260909" alt="Astan Kida — Artiste du mois" loading="lazy"></div>
  <div class="artist-month-shade"></div>
  <div class="artist-month-content">
    <span class="artist-month-pill"><i>✦</i> ARTISTE DU MOIS</span>
    <strong>ASTAN<br><em>KIDA</em></strong>
    <span class="artist-month-button">Découvrir son univers <b>→</b></span>
  </div>
  <span class="artist-note n1">♪</span><span class="artist-note n2">♫</span>
</a>'''

          pattern = r'<a class="artist-month-box".*?</a>\n<style id="artist-month-box-style">.*?</style>'
          replacement = new_card + '''
<style id="artist-month-box-style">
.artist-month-box{position:relative;display:block;width:100%;height:250px;margin-top:15px;border:2px solid #f2b900;border-radius:15px;overflow:hidden;text-decoration:none;background:#08090b;box-shadow:0 10px 25px rgba(0,0,0,.15);isolation:isolate}
.artist-month-photo{position:absolute;inset:0;z-index:0;background:#08090b;overflow:hidden}
.artist-month-photo img{position:absolute;right:0;top:0;width:58%;height:100%;display:block;object-fit:cover;object-position:center center;filter:saturate(1.06);transform:none}
.artist-month-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#08090b 0%,rgba(8,9,11,.98) 30%,rgba(8,9,11,.78) 46%,rgba(8,9,11,.18) 70%,rgba(8,9,11,.02) 100%)}
.artist-month-content{position:absolute;z-index:3;left:24px;top:20px;bottom:18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;max-width:58%}
.artist-month-pill{display:inline-flex;align-items:center;gap:7px;background:#ffbe16;color:#151515;border-radius:999px;padding:8px 13px;font:900 10px Montserrat,Arial;box-shadow:0 2px 7px rgba(0,0,0,.2);white-space:nowrap}
.artist-month-pill i{font-style:normal;font-size:14px}
.artist-month-content strong{display:block;color:#fff;font:900 31px/.92 Montserrat,Arial;letter-spacing:-.5px;margin:17px 0 15px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.artist-month-content strong em{font-style:normal;color:#ffbe16}
.artist-month-button{display:inline-flex;align-items:center;gap:15px;background:#ffbe16;color:#171717;border-radius:999px;padding:10px 15px 10px 17px;font:900 10px Montserrat,Arial;box-shadow:0 3px 8px rgba(0,0,0,.22);white-space:nowrap}
.artist-month-button b{font-size:19px;line-height:12px}
.artist-note{position:absolute;z-index:4;color:#ffbe16;font-size:25px;text-shadow:0 2px 6px #000;opacity:.95}.artist-note.n1{right:14px;top:13px}.artist-note.n2{right:15px;bottom:13px;font-size:31px}
@media(max-width:650px){.artist-month-box{height:210px;border-radius:12px}.artist-month-photo img{width:62%;object-position:center}.artist-month-content{left:15px;top:14px;max-width:68%}.artist-month-pill{font-size:8px;padding:7px 10px}.artist-month-pill i{font-size:12px}.artist-month-content strong{font-size:25px;margin:13px 0 12px}.artist-month-button{font-size:9px;padding:9px 12px 9px 14px;gap:9px}.artist-month-button b{font-size:17px}.artist-note{font-size:21px}.artist-note.n2{font-size:26px}}
</style>'''

          ns, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Astan Kida card/style block not found; no changes made')
          p.write_text(ns, encoding='utf-8')
          PY
      - name: Verify isolated card and local image
        run: |
          grep -q 'href="artiste-du-mois.html"' index.html
          grep -q 'assets/artistes/astan-kida.jpg' index.html
          test -s assets/artistes/astan-kida.jpg
      - name: Commit card redesign and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-astan-box.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/patch-astan-box.yml
          git commit -m 'Redesign Astan Kida sidebar card with local image'
          git push
