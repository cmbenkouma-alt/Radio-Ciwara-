name: Activer Facebook Live Ciwara

on:
  push:
    branches: [main]
    paths:
      - 'facebook-live.js'
      - '.github/workflows/activate-facebook-live.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-facebook-live]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forcer le chargement du script Facebook Live
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Retirer uniquement les anciennes balises script facebook-live.js.
          s = re.sub(r'\s*<script\s+src=["\']facebook-live\.js[^>]*></script>', '', s, flags=re.I)

          script = '<script src="facebook-live.js?v=20260912-3" defer></script>'
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Impossible de trouver </body> dans index.html')
          s = s.replace(marker, f'  {script}\n{marker}', 1)

          p.write_text(s, encoding='utf-8')
          print('Facebook Live : référence version 20260912-3 ajoutée.')

      - name: Publier la modification
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html déjà correctement configuré.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: charger Facebook Live v3 [skip-facebook-live]'
          git push
