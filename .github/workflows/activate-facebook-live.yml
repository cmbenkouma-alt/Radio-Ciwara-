name: Activer Facebook Live Ciwara

on:
  push:
    branches: [main]
    paths:
      - 'facebook-live.js'
      - '.github/workflows/activate-facebook-live.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-facebook-live]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Injecter la version du script Facebook Live dans index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="facebook-live.js?v=20260912" defer></script>'
          new = '<script src="facebook-live.js?v=20260912-2" defer></script>'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Impossible de trouver </body> dans index.html')
              s = s.replace(marker, f'  {new}\n{marker}', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publier la modification
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Version Facebook Live déjà à jour.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: versionner Facebook Live [skip-facebook-live]'
          git push
