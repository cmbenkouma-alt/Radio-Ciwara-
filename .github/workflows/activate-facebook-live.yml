name: Activer Facebook Live Ciwara

on:
  push:
    branches: [main]
    paths:
      - 'facebook-live.js'
      - '.github/workflows/activate-facebook-live.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-facebook-live]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Injecter le script Facebook Live dans index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="facebook-live.js?v=20260912" defer></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Impossible de trouver </body> dans index.html')
              s = s.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Publier la modification
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Facebook Live déjà activé.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: activer le nouvel espace Facebook Live [skip-facebook-live]'
          git push
