name: Nettoyage Facebook Live Ciwara

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-facebook-live-final.yml'
      - 'index.html'
      - 'facebook-live.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Supprimer Facebook Live sans toucher au Caster.fm
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Supprimer toute ancienne référence au script Facebook Live.
          s = re.sub(r'\s*<script\s+src=["\']facebook-live\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', s, flags=re.I)

          # Supprimer le texte Facebook résiduel du Hero.
          s = s.replace('<p class="ciwara-hero-caption">Suivez Radio Ciwara en direct sur Facebook</p>', '')

          p.write_text(s, encoding='utf-8')

          # Remplacer le script Facebook par un nettoyage défensif très court.
          js = Path('facebook-live.js')
          if js.exists():
              js.write_text("""(() => {\n  'use strict';\n  const cleanup = () => {\n    document.querySelectorAll('.ciwara-facebook-live-below-news, .ciwara-facebook-live, iframe[src*=' + JSON.stringify('facebook.com') + ']').forEach(el => {\n      if (!el.closest('.cstrEmbed')) el.remove();\n    });\n    document.querySelectorAll('.ciwara-hero-caption').forEach(el => el.remove());\n  };\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', cleanup, { once: true });\n  else cleanup();\n})();\n""", encoding='utf-8')

      - name: Vérification stricte du Caster.fm
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '236f6884-9ad2-465f-a29e-5f349a8dac8e' in s, 'publicToken Caster.fm absent'
          assert 'a27e1e52-bcc3-4ee8-9b8d-8bce0f345b47' in s, 'channelId Caster.fm absent'
          assert 'class="cstrEmbed"' in s, 'conteneur Caster.fm absent'
          assert 'facebook-live.js' not in s, 'ancien script Facebook encore chargé par index.html'
          assert 'ciwara-hero-caption' not in s, 'résidu Facebook dans le Hero'
          print('OK: Caster.fm intact et Facebook retiré de index.html.')

      - name: Publier
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html facebook-live.js
          if git diff --cached --quiet; then
            echo 'Aucune modification nécessaire.'
            exit 0
          fi
          git commit -m 'fix: supprimer définitivement Facebook Live parasite [skip-facebook-live]'
          git push
