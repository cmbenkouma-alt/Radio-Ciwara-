name: Corriger le contact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour le numéro et le visuel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('+223 20 22 10 55', '+223 94 94 94 81')
          marker = '<style id="contact-visual-fix">'
          if marker not in s:
              css = '''<style id="contact-visual-fix">
          .contact-box{border-top:4px solid #e81e4d;box-shadow:0 12px 30px rgba(0,0,0,.08);border-radius:8px;padding:28px 32px;display:flex;flex-direction:column;gap:10px}
          .contact-box b{font-size:22px;margin-bottom:2px}
          .contact-box a{font-size:20px;font-weight:700;color:#e81e4d;text-decoration:none}
          .contact-box a:hover{text-decoration:underline}
          .contact-box span{font-size:22px;font-weight:800;letter-spacing:.5px;color:#222}
          .contact-box span:last-child{display:inline-flex;align-items:center;gap:8px}
          @media(max-width:700px){.contact-box{padding:22px}.contact-box span{font-size:19px}}
          </style>'''
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo 'Aucun changement nécessaire.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Contact: mettre à jour le numéro et améliorer le visuel'
          git push
