name: One-time site cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove requested homepage elements
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove the complete generated Ciwara Infos homepage block, including its style.
          s = re.sub(
              r'\s*<!-- CIWARA-INFOS-HOME:START -->.*?<!-- CIWARA-INFOS-HOME:END -->\s*',
              '\n', s, flags=re.S
          )

          # Remove Dolo Karamoko banner markup wherever it is embedded.
          # Prefer removing the containing anchor; otherwise remove a containing div,
          # then remove any remaining direct image reference.
          s = re.sub(
              r'<a\b[^>]*>[^<]*(?:<[^>]+>)*[^<]*dolo-karamoko[^<]*.*?</a>',
              '', s, flags=re.I|re.S
          )
          s = re.sub(
              r'<div\b[^>]*>.*?dolo-karamoko.*?</div>',
              '', s, flags=re.I|re.S
          )
          s = re.sub(
              r'<img\b[^>]*dolo-karamoko[^>]*>',
              '', s, flags=re.I|re.S
          )
          s = re.sub(r'\n{3,}', '\n\n', s)

          if s == original:
              print('No requested markup found in index.html; checking repository references.')
          else:
              p.write_text(s, encoding='utf-8')
              print('index.html cleaned.')

          if '<!-- CIWARA-INFOS-HOME:START -->' in s or '<!-- CIWARA-INFOS-HOME:END -->' in s:
              raise SystemExit('Ciwara Infos homepage markers still present')
          if re.search(r'dolo-karamoko', s, re.I):
              raise SystemExit('Dolo Karamoko reference still present in index.html')

      - name: Commit cleanup and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-cleanup.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Remove Ciwara Infos homepage block and Dolo banner'
          git push