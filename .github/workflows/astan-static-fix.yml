name: Astan static fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          a=s.find('<style id="ciwara-astan-kida-new-style">')
          b=s.find('<script id="ciwara-astan-kida-new-script">', a)
          if a>=0 and b>=0:
              e=s.find('</script>', b)
              if e>=0: s=s[:a]+s[e+9:]
          old_artist='<style>.artist-month-box{display:block!important;width:100%!important;height:auto!important;min-height:0!important;aspect-ratio:auto!important;overflow:hidden!important}.artist-month-box .artist-month-image{display:block!important;visibility:visible!important;opacity:1!important;width:100%!important;height:auto!important;max-width:none!important;max-height:none!important;min-width:0!important;min-height:0!important;object-fit:contain!important;object-position:center!important;filter:none!important}.artist-month-shade,.artist-month-content,.artist-note{display:none!important}</style>'
          s=s.replace(old_artist,'')
          if 'id="ciwara-astan-kida-static-mover"' not in s:
              script='''<script id="ciwara-astan-kida-static-mover">(()=>{const move=()=>{const box=document.getElementById('ciwara-astan-kida-static-box'),panel=document.querySelector('.mali-radio-panel'),ortm=panel&&panel.querySelector('.mali-ortm-block');if(!box||!panel||!ortm)return false;ortm.parentNode.insertBefore(box,ortm);return true};if(!move()){const o=new MutationObserver(()=>{if(move())o.disconnect()});o.observe(document.body,{childList:true,subtree:true});setTimeout(()=>o.disconnect(),20000)}})();</script>'''
              marker='</aside>'
              pos=s.find(marker)
              if pos<0: raise SystemExit('aside close not found')
              s=s[:pos]+script+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'ciwara-astan-kida-static-box' index.html
          grep -q 'ciwara-astan-kida-static-mover' index.html
          grep -q '/assets/artistes/astan-kida-artiste-du-mois.png?v=20260914-3' index.html
          grep -q 'data-publicToken="236f6884-9ad2-465f-a29e-5f349a8dac8e"' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: place Astan Kida box above ORTM'
          git push origin main
