name: Fix images Ciwara Infos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-news-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corriger les chemins et le rendu des images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ('data/ciwara-info.json', 'data/news.json'):
              p = Path(name)
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  s = s.replace('assets/ciwara-info/514/', 'assets/')
                  p.write_text(s, encoding='utf-8')

          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          new_fn = "function imageSrc(url){if(!url)return 'logo.jpg';if(/^https:\\/\\/i.test(url))return url;if(/^http:\\/\\/i.test(url))return 'https://images.weserv.nl/?url='+encodeURIComponent(url);if(url.startsWith('data/'))return url;return url}"
          s2, count = re.subn(r'function imageSrc\(url\)\{.*?\}', new_fn, s, count=1)
          if count != 1:
              raise SystemExit('Fonction imageSrc introuvable: arrêt pour éviter une modification incorrecte.')
          p.write_text(s2, encoding='utf-8')

          p = Path('ciwara-info.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const src=images[x?.title];', "const src=images[x?.title] || x?.image;")
          s = s.replace('const src=images[x.title];', "const src=images[x.title] || x.image;")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publier la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ciwara-info.json data/news.json script.js ciwara-info.html
          if git diff --cached --quiet; then
            echo "Aucune correction nécessaire."
          else
            git commit -m "fix: afficher les images de la parution 514"
            git pull --rebase origin main
            git push origin main
          fi
          rm -f .github/workflows/fix-news-images.yml
          git add -u .github/workflows/fix-news-images.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: retirer le workflow de réparation temporaire"
            git push origin main
          fi
