name: Installer correctif Hero Ciwara
on:
  push:
    paths:
      - 'hero-preserve.js'
      - '.github/workflows/install-hero-preserve.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter le script de restauration Hero
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="hero-preserve.js?v=20260912"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'\n</body></html>')
              p.write_text(s,encoding='utf-8')
      - name: Commit et push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restaurer le lecteur et le slider du Hero'
          git push
