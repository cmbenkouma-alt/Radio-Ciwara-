name: Positionner le Facebook Live sous A LA UNE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/position-facebook-live.yml'

permissions:
  contents: write

jobs:
  position:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déplacer le box Facebook Live sous À LA UNE
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('<div class="ciwara-facebook-live"')
          if start != -1:
              end_marker = '<p class="ciwara-hero-caption">Suivez Radio Ciwara en direct sur Facebook</p>'
              end = s.find(end_marker, start)
              if end == -1:
                  raise SystemExit('Box Facebook trouvé mais fin introuvable.')
              end += len(end_marker)
              s = s[:start] + s[end:]

          widget = '''\n<div class="ciwara-facebook-live ciwara-facebook-live-below-news" aria-label="LIVE FACEBOOK RADIO CIWARA">
  <div class="facebook-live-title"><b>CIWARA LIVE</b><span>● FACEBOOK LIVE</span></div>
  <div class="facebook-live-frame">
    <iframe src="https://www.facebook.com/plugins/video.php?height=314&amp;href=https%3A%2F%2Fwww.facebook.com%2Fradiociwarafm%2Fvideos%2F3154611518262011%2F&amp;show_text=false&amp;width=560&amp;t=0" width="560" height="314" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowFullScreen="true" title="Facebook Live Radio Ciwara"></iframe>
  </div>
  <p class="ciwara-live-caption">Suivez Radio Ciwara en direct sur Facebook</p>
</div>\n'''

          if 'class="ciwara-facebook-live ciwara-facebook-live-below-news"' not in s:
              anchor = '<div style="margin-top:18px"><div class="news-grid" id="newsGrid">'
              if anchor not in s:
                  raise SystemExit('Emplacement À LA UNE introuvable.')
              s = s.replace(anchor, widget + anchor, 1)

          style = '''<style id="ciwara-facebook-below-news-style">
.ciwara-facebook-live-below-news{position:relative;width:100%;margin:20px 0 0;border:2px solid #1877f2;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.ciwara-facebook-live-below-news .facebook-live-title{height:44px;padding:0 14px;background:linear-gradient(90deg,#111214,#1877f2);font-size:12px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #f7d51b;box-sizing:border-box}
.ciwara-facebook-live-below-news .facebook-live-title span{color:#f7d51b;font-size:8px}
.ciwara-facebook-live-below-news .facebook-live-frame{position:relative;width:100%;aspect-ratio:560/314;background:#000;overflow:hidden}
.ciwara-facebook-live-below-news .facebook-live-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ciwara-facebook-live-below-news .ciwara-live-caption{margin:0;padding:9px 12px;background:#111214;color:#f7d51b;font:800 10px Montserrat;text-align:center}
@media(max-width:650px){.ciwara-facebook-live-below-news{margin-top:16px}.ciwara-facebook-live-below-news .facebook-live-title{height:40px}.ciwara-facebook-live-below-news .facebook-live-frame{aspect-ratio:16/9}}
</style>'''
          if 'id="ciwara-facebook-below-news-style"' not in s:
              s = s.replace('</head>', style + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          print('Facebook Live positionné sous À LA UNE. Caster.fm conservé.')

      - name: Commit la modification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/position-facebook-live.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Placer Facebook Live sous A LA UNE sans toucher Caster.fm'
          git push
