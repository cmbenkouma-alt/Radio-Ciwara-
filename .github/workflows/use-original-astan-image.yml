name: Use original Astan Kida image

on:
  push:
    paths:
      - '.deploy-astan-original'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only Astan Kida image source
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(<div id="ciwara-astan-kida-static-box"[^>]*>.*?<img\s+src=")[^"]+("\s+alt="Astan Kida — artiste à l’honneur")'
          new, n = re.subn(pattern, r'\1/assets/ChatGPT Image 14 sept. 2026, 00_09_21.png\2', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Astan image tag not found exactly once: {n}')
          p.write_text(new, encoding='utf-8')
      - name: Remove temporary trigger and workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .deploy-astan-original .github/workflows/use-original-astan-image.yml
          git add index.html
          git commit -m "fix: display original Astan Kida image"
          git push
