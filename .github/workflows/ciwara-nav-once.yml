name: Ciwara unified navigation redesign

on:
  push:
    paths:
      - .github/workflows/ciwara-nav-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unified navigation
        shell: python
        run: |
          from pathlib import Path

          style = Path('style.css')
          index = Path('index.html')
          marker = '/* CIWARA UNIFIED ICON NAVIGATION */'

          css = r'''
          /* CIWARA UNIFIED ICON NAVIGATION */
          .portal-nav{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);box-shadow:0 7px 24px rgba(0,0,0,.08)}
          .portal-nav .container{min-height:78px;gap:20px}
          .portal-links{display:flex;align-items:stretch;justify-content:flex-end;flex-wrap:nowrap;gap:4px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
          .portal-links::-webkit-scrollbar{display:none}
          .portal-links a{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:8px 11px;border-radius:12px;font:900 10px/1 Montserrat;color:#242629;text-decoration:none;letter-spacing:.15px;transition:background .2s ease,color .2s ease,transform .2s ease;white-space:nowrap}
          .portal-links a:before{font-family:'Material Symbols Rounded';font-size:22px;font-weight:400;line-height:1;letter-spacing:normal;display:inline-block;font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 24;transition:transform .2s ease,color .2s ease}
          .portal-links a:nth-child(1):before{content:'home'}
          .portal-links a:nth-child(2):before{content:'newspaper'}
          .portal-links a:nth-child(3):before{content:'radio'}
          .portal-links a:nth-child(4):before{content:'calendar_month'}
          .portal-links a:nth-child(5):before{content:'podcasts'}
          .portal-links a:nth-child(6):before{content:'tv'}
          .portal-links a:nth-child(7):before{content:'event'}
          .portal-links a:nth-child(8):before{content:'more_horiz'}
          .portal-links a:hover{background:#f2f7f4;color:#087c45;transform:translateY(-1px)}
          .portal-links a:hover:before{color:#0b8f4d;transform:scale(1.08)}
          .portal-links a.active{background:linear-gradient(135deg,#0b8f4d,#08713e);color:#fff;box-shadow:0 6px 16px rgba(11,143,77,.22)}
          .portal-links a.active:after{display:none}
          .portal-links a.active:before{color:#f7d51b;font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 24}
          .portal-cats{display:none!important}
          @media(max-width:1050px){.portal-nav .container{gap:12px}.brand-pair .brand{min-width:205px}.ciwara-infos-brand{width:145px;min-width:145px}.portal-links a{padding:8px 8px;font-size:9px}.portal-links a:before{font-size:20px}}
          @media(max-width:900px){.portal-nav .container{min-height:70px}.portal-links{display:flex!important;justify-content:flex-start;flex:1}.portal-links a{min-width:max-content}.portal-cats{display:none!important}}
          @media(max-width:650px){.portal-nav .container{min-height:68px;gap:8px}.brand-pair{flex:0 0 auto;max-width:205px}.brand-pair .brand{min-width:0}.ciwara-infos-brand{width:88px;min-width:88px;height:40px}.portal-links{gap:2px}.portal-links a{min-height:44px;padding:7px 9px;border-radius:10px;font-size:0}.portal-links a:before{font-size:23px}.portal-links a.active{padding-left:11px;padding-right:11px}.portal-links a.active:after{display:none}}
          @media(prefers-reduced-motion:reduce){.portal-links a,.portal-links a:before{transition:none}}
          '''

          current = style.read_text(encoding='utf-8')
          if marker not in current:
              style.write_text(current.rstrip() + '\n\n' + css.strip() + '\n', encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          font = '<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=swap" rel="stylesheet"/>'
          if 'Material+Symbols+Rounded' not in html:
              html = html.replace('</head>', font + '\n</head>', 1)
          index.write_text(html, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ciwara-nav-once.yml
          git add style.css index.html .github/workflows/ciwara-nav-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: unify Radio Ciwara navigation with themed icons [skip ci]"
          git push origin main
