name: Retirer Facebook Live du Hero

on:
  push:
    paths:
      - '.github/workflows/remove-hero-facebook.yml'

permissions:
  contents: write

jobs:
  remove-hero-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Retirer uniquement le bloc Facebook du Hero
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = r'<div class="ciwara-facebook-live" aria-label="LIVE FACEBOOK RADIO CIWARA">.*?</div></div>(<p class="ciwara-hero-caption">)'
          new_html, count = re.subn(pattern, r'\1', html, count=1, flags=re.S)

          if count != 1:
              raise SystemExit(f'Bloc Facebook du Hero introuvable ou déjà supprimé (matches={count})')

          path.write_text(new_html, encoding='utf-8')
          print('Bloc Facebook du Hero supprimé. Caster.fm inchangé.')

      - name: Vérifier Caster.fm et supprimer ce workflow temporaire
        shell: bash
        run: |
          grep -q 'data-publicToken="236f6884-9ad2-465f-a29e-5f349a8dac8e"' index.html
          grep -q 'data-channelId="a27e1e52-bcc3-4ee8-9b8d-8bce0f345b47"' index.html
          grep -q 'facebook-live.js' index.html
          rm -f .github/workflows/remove-hero-facebook.yml

      - name: Commit et push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Supprimer Facebook Live du Hero'
          git push
