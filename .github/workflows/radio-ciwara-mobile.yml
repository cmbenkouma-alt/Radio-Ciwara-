name: Radio Ciwara Mobile

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [app-foundation]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'ciwara-tv.html'
      - 'ciwara-info.html'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/radio-ciwara-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'ciwara-tv.html'
      - 'ciwara-info.html'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/radio-ciwara-mobile.yml'

permissions:
  contents: write

env:
  APP_REF: app-foundation

jobs:
  update-news:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-foundation
        uses: actions/checkout@v4
        with:
          ref: app-foundation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build news feed from publisher RSS
        run: python tools/fetch_news.py
      - name: Commit updated news only when changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: refresh news feed"
          git push origin HEAD:app-foundation

  android-release:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-foundation
        uses: actions/checkout@v4
        with:
          ref: app-foundation
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create --platforms=android .
      - name: Ensure Android internet permission
        working-directory: mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
              p.write_text(text, encoding='utf-8')
          print('Android INTERNET permission verified.')
          PY
      - name: Remove generated placeholder test
        working-directory: mobile
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Run tests
        working-directory: mobile
        run: flutter test
      - name: Build Android release App Bundle
        working-directory: mobile
        run: flutter build appbundle --release
      - name: Build Android release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radio-ciwara-android-release
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-release-prepare:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - name: Checkout app-foundation
        uses: actions/checkout@v4
        with:
          ref: app-foundation
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform files
        working-directory: mobile
        run: flutter create --platforms=ios .
      - name: Remove generated placeholder test
        working-directory: mobile
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Run tests
        working-directory: mobile
        run: flutter test
      - name: Prepare iOS release build
        working-directory: mobile
        run: flutter build ios --release --no-codesign

  site-validation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-foundation
        uses: actions/checkout@v4
        with:
          ref: app-foundation
      - name: Validate required site files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          test -s data/news.json
          test -s data/schedule.json
          test -s ciwara-tv.html
          test -s ciwara-info.html
      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              pass
          for path in [Path('index.html'), Path('ciwara-tv.html'), Path('ciwara-info.html')]:
              Parser().feed(path.read_text(encoding='utf-8'))
              print(f'OK: {path}')
          PY
