name: Radio Ciwara Mobile

on:
  push:
    branches: [app-foundation]
    paths:
      - 'mobile/**'
      - '.github/workflows/radio-ciwara-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/radio-ciwara-mobile.yml'

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Build Android release App Bundle
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Build Android release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radio-ciwara-android-release
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-release-prepare:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform files
        working-directory: mobile
        run: flutter create --platforms=ios .

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Prepare iOS release build
        working-directory: mobile
        run: flutter build ios --release --no-codesign

  site-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required site files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          test -s data/news.json
          test -s data/schedule.json
          test -s ciwara-tv.html
          test -s ciwara-info.html

      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          for path in [Path('index.html'), Path('ciwara-tv.html'), Path('ciwara-info.html')]:
              Parser().feed(path.read_text(encoding='utf-8'))
              print(f'OK: {path}')
          PY
