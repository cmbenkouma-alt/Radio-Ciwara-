name: Integrate official radio schedule
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message != 'feat: integrate automated official programme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build programme widget and inject into homepage
        shell: python
        run: |
          from pathlib import Path
          p=Path('programme-ciwara.js')
          js=r'''(()=>{
          const S={
          "Lundi":[["06:45","07:00","Ouverture d’antenne"],["07:00","08:00","Tour d’Horizon"],["08:00","09:00","Ciwara Matin"],["09:00","09:05","Flash Infos de la radio Ciwara"],["09:05","10:00","Musiques – Annonces et Publicités"],["10:00","11:30","Revue de la Presse – Gaffé – Commentaire des articles de presse"],["11:30","13:00","Baroni Sensibilisation"],["13:00","14:00","Maana"],["14:00","14:05","Flash Ciwara FM"],["14:05","15:00","Mouna Pourquoi"],["15:00","16:00","Ciwara Sports"],["16:00","17:00","Soumou (Musical)"],["17:00","18:00","Ciwara Love"],["18:00","18:15","Grand Journal de la radio Ciwara FM 105.5"],["18:15","19:00","Baroni Sensibilisation"],["19:00","20:00","Rediffusion Revue de la Presse – Gaffé – Commentaire des articles de presse"],["20:00","21:00","Senoufo"],["21:00","22:00","Seko ni Donko"],["22:00","23:00","Retro Mali"],["23:00","00:00","Top Mandingue"]],
          "Mardi":[["06:45","07:00","Ouverture d’antenne"],["08:00","09:00","Ciwara Matin"],["09:00","09:05","Flash Infos de la radio Ciwara"],["10:00","11:30","Ciwara Sports"],["11:30","13:00","Naré kènè A ni Fôli Duman"],["13:00","14:00","Mali Koura Djô Kènè"],["14:00","14:05","Flash Ciwara FM"],["14:05","15:00","Femmes et Société"],["15:00","16:00","Fôli Douman Kènè (Musical)"],["16:00","17:00","Soumou (Musical)"],["17:00","18:00","Ciwara Love (Musical)"],["18:00","18:15","Bwa"],["18:15","19:00","Baroni Sensibilisation"],["19:00","20:00","Rap Mali (Musical)"],["20:00","21:00","Sécurité routière"],["21:00","22:00","Top Indou"],["22:00","23:00","Salsa Sénégal"],["23:00","00:00","Diaspora"]],
          "Mercredi":[["06:45","07:00","Ouverture d’antenne"],["08:00","09:00","Ciwara Matin"],["09:00","09:05","Soumou"],["09:05","10:00","Retro Music"],["10:00","11:30","Droit et devoir"],["11:30","13:00","Maliba ni à Kungow"],["13:00","14:00","Hit du Mali (Musical)"],["14:00","14:05","Mon Environnement"],["14:05","15:00","Douba ni A Konokow"],["15:00","16:00","J’aime Ma Commune"],["16:00","17:00","Soumou (Musical)"],["17:00","18:00","Ciwara Love (Musical)"],["18:00","18:15","Côte d’Ivoire"],["18:15","19:00","Baroni Sensibilisation"],["19:00","20:00","Rap Mali (Musical)"],["20:00","21:00","Bani Ka Dou Tanou"],["21:00","22:00","Hit du Mali (Musical)"],["22:00","23:00","Yéelen"],["23:00","00:00","Top Mandingue"],["00:00","01:00","Ciwara Mix"]],
          "Jeudi":[["06:45","07:00","Ouverture d’antenne"],["08:00","09:00","Ciwara Matin"],["10:00","11:30","Droit et devoir"],["11:30","13:00","Maliba ni à Kungow"],["13:00","14:00","Maana"],["14:00","14:05","Tièssiri Kènè"],["14:05","15:00","Education Civique"],["15:00","16:00","Fôli Douman Kènè (Musical)"],["16:00","17:00","Zikiri Kènè"],["17:00","18:00","Ciwara Love (Musical)"],["18:00","18:15","Grand Journal de la radio Ciwara FM"],["18:15","19:00","Baroni Sensibilisation"],["20:00","21:00","Ciwara Sports"],["22:00","23:00","Terroir (Bèlèdougou Fôli)"],["23:00","00:00","Ciwara Mix"]],
          "Vendredi":[["06:45","07:00","Ouverture d’antenne"],["08:00","09:00","Ciwara Matin"],["10:00","11:30","Ciwara Sports"],["11:30","13:00","Naré kènè A ni Fôli Duman"],["13:00","14:00","Maana"],["14:00","14:05","Flash Ciwara FM"],["15:00","16:00","Yéelen"],["16:00","17:00","Sonrhai"],["17:00","18:00","Ciwara Love (Musical)"],["18:00","18:15","Grand Journal de la radio Ciwara FM"],["18:15","19:00","Baroni Sensibilisation"],["19:00","20:00","Rap Mali (Musical)"],["20:00","21:00","Bani Ka Dou Tanou"],["21:00","22:00","Tièben Kènè"],["23:00","00:00","Ciwara Mix"],["00:00","01:00","Ciwara Mix"]],
          "Samedi":[["06:45","07:00","Ouverture d’antenne"],["08:00","09:00","OMA"],["09:00","09:05","Retro Music"],["10:00","11:30","Ciwara Sports"],["11:30","13:00","Naré kènè A ni Fôli Duman"],["13:00","14:00","Hit du Mali (Musical)"],["14:00","14:05","Tièssiri Kènè"],["14:05","15:00","Douba ni A Konokow"],["15:00","16:00","Hit de la Guinée"],["16:00","17:00","Sonrhai"],["17:00","18:00","A ma Famou"],["18:00","18:15","Bwa"],["18:15","19:00","Baroni Sensibilisation"],["20:00","21:00","L’émission Songhaï (Lassalle)"],["22:00","23:00","Terroir (Bèlèdougou Fôli)"],["00:00","01:00","Ciwara Mix"]],
          "Dimanche":[["06:45","07:00","Ouverture d’antenne"],["08:00","09:00","Ciwara Matin"],["09:00","09:05","Soumou"],["10:00","11:30","Droit et devoir"],["11:30","13:00","Maliba ni à Kungow"],["13:00","14:00","Maana"],["14:00","14:05","Flash Ciwara FM"],["14:05","15:00","Education Civique"],["15:00","16:00","Nous les enfants"],["16:00","17:00","Dogon"],["17:00","18:00","Ciwara Contes, Humour et Rire"],["18:00","18:15","Côte d’Ivoire"],["20:00","21:00","L’émission Top Indou"],["22:00","23:00","Yéelen"],["00:00","01:00","Ciwara Mix"]]};
          const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));
          const dayNames=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
          const mins=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
          function current(){const n=new Date();const day=dayNames[n.getDay()];let now=n.getHours()*60+n.getMinutes();let list=S[day]||[];for(const x of list){let a=mins(x[0]),b=mins(x[1]);if(b===0)b=1440;if(a<=now && now<b)return [day,x];}return [day,null]}
          function render(){const old=document.getElementById('ciwara-live-program');if(old)old.remove();const [day,cur]=current();const sec=document.getElementById('programmes');if(!sec)return;const box=document.createElement('div');box.id='ciwara-live-program';box.innerHTML=`<div class="ciwara-live-program-head"><div><span>À L’ANTENNE MAINTENANT</span><h3>${cur?esc(cur[2]):'Aucune émission programmée à cette heure'}</h3><small>${cur?cur[0]+' · '+cur[1][0]+' — '+cur[1][1]:day}</small></div><strong>● LIVE</strong></div>`;sec.querySelector('.container').prepend(box);}
          const style=document.createElement('style');style.textContent=`#ciwara-live-program{margin:0 0 20px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#111214,#087f3f);color:#fff;border:2px solid #f7d51b;box-shadow:0 8px 22px rgba(0,0,0,.12)}#ciwara-live-program .ciwara-live-program-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 20px}#ciwara-live-program span{font:900 8px Montserrat;color:#f7d51b;letter-spacing:1px}#ciwara-live-program h3{font:900 21px/1.15 Montserrat;margin:5px 0}#ciwara-live-program small{font:500 11px Roboto;color:#ddd}#ciwara-live-program strong{font:900 9px Montserrat;color:#f7d51b;white-space:nowrap}@media(max-width:600px){#ciwara-live-program .ciwara-live-program-head{padding:14px}.ciwara-live-program h3{font-size:17px}}`;document.head.appendChild(style);render();setInterval(render,30000);
          })();'''
          p.write_text(js,encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          if 'programme-ciwara.js' not in html:
              html=html.replace('</body>','<script src="programme-ciwara.js?v=20260909"></script>\n</body>')
          Path('index.html').write_text(html,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html programme-ciwara.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate automated official programme"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/integrate-program.yml || true
          git commit -m "chore: remove one-time programme workflow" || true
          git push || true
