name: Process L'ALERTE N180

on:
  push:
    branches: [main]
    paths:
      - "media/lalerte/editions/*.pdf"
      - ".github/workflows/process-lalerte.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python3 -m pip install --user pillow

      - name: Build article images and data
        env:
          PDF_PATH: "media/lalerte/editions/L'ALERTE N°180.pdf"
        run: |
          set -e
          test -s "$PDF_PATH"
          rm -rf assets/lalerte/n180
          mkdir -p assets/lalerte/n180/pages assets/lalerte/n180/articles
          pdfinfo "$PDF_PATH" > /tmp/pdfinfo.txt
          pages=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test "$pages" -eq 8
          pdftoppm -jpeg -r 180 -jpegopt quality=88 "$PDF_PATH" assets/lalerte/n180/pages/page
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          scale=180/72
          crops=[
            ('article-01',1,14,505,614,698),
            ('article-02',2,13,198,392,442),
            ('article-03',2,597,564,780,780),
            ('article-04',3,13,115,775,478),
            ('article-05',4,403,119,780,469),
            ('article-06',4,14,641,390,942),
            ('article-07',7,596,67,781,276),
            ('article-08',7,657,344,778,395),
          ]
          for aid,page,x0,y0,x1,y1 in crops:
              src=Path(f'assets/lalerte/n180/pages/page-{page}.jpg')
              im=Image.open(src)
              box=tuple(round(v*scale) for v in (x0,y0,x1,y1))
              box=(max(0,box[0]),max(0,box[1]),min(im.width,box[2]),min(im.height,box[3]))
              im.crop(box).save(f'assets/lalerte/n180/articles/{aid}.jpg',quality=90,optimize=True)
          PY
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          articles=[
            {'id':'article-01','page':1,'category':'À LA UNE','title':"L’Assep, le Groupe et l’Unajep désapprouvent la démarche de la MP",'excerpt':"Le Cadre de concertation des faîtières de la presse écrite privée conteste la méthode engagée par la Maison de la Presse autour de l’organe d’autorégulation et de la relecture de la Convention collective.",'image':'assets/lalerte/n180/articles/article-01.jpg'},
            {'id':'article-02','page':2,'category':'INTERVIEW','title':"« Samaké Voyage et Fret, c’est l’acheminement des colis et passeports en toute confiance et en toute sécurité »",'excerpt':"Sékou Samaké, PDG de Samaké Voyage et Fret, présente une société logistique active entre le Mali, le Sénégal, la Guinée, l’Italie et la France.",'image':'assets/lalerte/n180/articles/article-02.jpg'},
            {'id':'article-03','page':2,'category':'ÉCONOMIE · PRESSE','title':"ASSEP-APEX : Vers la concrétisation d’un partenariat stratégique",'excerpt':"Une délégation de l’Association des Éditeurs de Presse Privée, conduite par Boubacar Yalkoué, a rencontré le directeur général de l’APEX Massoudou Cissé pour avancer vers un partenariat formel.",'image':'assets/lalerte/n180/articles/article-03.jpg'},
            {'id':'article-04','page':3,'category':'À LA UNE','title':"Organe d’autorégulation et relecture de la Convention collective : l’Assep, le Groupe et l’Unajep désapprouvent la démarche de la MP",'excerpt':"Les organisations de la presse écrite privée réaffirment leur attachement au dialogue, à la concertation et à l’autorégulation, tout en demandant une démarche inclusive.",'image':'assets/lalerte/n180/articles/article-04.jpg'},
            {'id':'article-05','page':4,'category':'NATION','title':"Ancien DG des Douanes Amadou Konaté : Un modèle de l’excellence et de rigueur !",'excerpt':"L’édition revient sur le bilan d’Amadou Konaté à la tête des Douanes maliennes, notamment les résultats de mobilisation des recettes et les réformes structurelles.",'image':'assets/lalerte/n180/articles/article-05.jpg'},
            {'id':'article-06','page':4,'category':'NATION','title':"Présidence malienne de l’OMD-AOC : Le bilan jugé exceptionnel",'excerpt':"Le Mali a transmis le flambeau de la Vice-Présidence de la Région Afrique Occidentale et Centrale de l’Organisation Mondiale des Douanes après un mandat marqué par la modernisation et la lutte contre la fraude.",'image':'assets/lalerte/n180/articles/article-06.jpg'},
            {'id':'article-07','page':7,'category':'VIE DES STARS','title':"Elton John donne un concert de plus de deux heures à Rio",'excerpt':"Elton John s’est produit au festival Rock in Rio avec un concert de plus de deux heures et vingt-quatre chansons devant 100.000 spectateurs.",'image':'assets/lalerte/n180/articles/article-07.jpg','source':'20 Minutes'},
            {'id':'article-08','page':7,'category':'INSOLITE','title':"La plus petite voiture au monde",'excerpt':"Réalisée à partir d’une Fiat Panda 1993, cette voiture mesure seulement 50,20 cm de large, 3,40 mètres de long et 1,45 mètre de haut. Andrea Marazzi a fait inscrire son record au Livre Guinness.",'image':'assets/lalerte/n180/articles/article-08.jpg','source':'Le Dauphiné Libéré'}]
          data={'edition':"L'ALERTE N°180",'date':'15 septembre 2026','pdf':"media/lalerte/editions/L'ALERTE N°180.pdf",'generatedAt':datetime.now(timezone.utc).isoformat(),'imagePolicy':'Chaque carte utilise un recadrage de la photographie ou illustration réellement placée avec le sujet dans le PDF. Les pages complètes sont conservées séparément pour la lecture de l’édition.','articles':articles,'pages':[{'page':i,'image':f'assets/lalerte/n180/pages/page-{i}.jpg'} for i in range(1,9)]}
          Path('data/lalerte-180.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit generated LALERTE content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lalerte-180.json assets/lalerte/n180
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: publish LALERTE articles and matching images"
            git push
          fi
