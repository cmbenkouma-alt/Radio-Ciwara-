name: Remove fixed bottom player

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-bottom-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only the fixed bottom player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* CIWARA: fixed bottom player disabled */'
          if marker not in s:
              s += '\n' + marker + '\n.bottom-player{display:none!important}\nbody{padding-bottom:0!important}\n@media(max-width:760px){body{padding-bottom:0!important}}\n'
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git rm .github/workflows/remove-bottom-player.yml
          git commit -m "Retrait du lecteur fixe en bas du site"
          git push
