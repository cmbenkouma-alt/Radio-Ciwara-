name: Fix Astan Kida images
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Astan Kida image into local assets
        shell: bash
        run: |
          set -e
          mkdir -p assets/artistes
          curl -L --fail --retry 3 -o assets/artistes/astan-kida.jpg 'https://www.musicinafrica.net/sites/default/files/styles/profile_photo/public/images/artist_profile/201502/astankida.jpg'
          test -s assets/artistes/astan-kida.jpg
      - name: Replace every external Astan Kida image with local asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          local = 'assets/artistes/astan-kida.jpg'
          external_markers = (
            'musicinafrica.net/sites/default/files/styles/profile_photo/',
            'musicinafrica.net/sites/default/files/styles/profile_images_thumbnail/',
            'images.weserv.nl/?url=www.musicinafrica.net/'
          )
          for p in Path('.').rglob('*.html'):
            if '.git' in p.parts:
              continue
            s = p.read_text(encoding='utf-8')
            old = s
            import re
            s = re.sub(r'https?://(?:images\.weserv\.nl/\?url=)?www\.musicinafrica\.net/sites/default/files/[^\"\'\s>]+', local, s)
            if s != old:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit local image and HTML fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/artistes/astan-kida.jpg '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Host Astan Kida images locally'
          git push
