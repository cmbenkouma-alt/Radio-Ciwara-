name: Uniformiser les pastilles publicitaires
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uniformiser uniquement les pastilles pub
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</head>'
          css='''<style id="ciwara-pub-format">.portal-ad-grid{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}.portal-ad{height:86px!important;min-height:86px!important;padding:0!important;border-radius:5px!important;overflow:hidden!important}.portal-ad img{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important}.portal-ad.moov,.portal-ad.local{display:flex!important;align-items:center!important;justify-content:space-between!important;box-sizing:border-box!important;padding:15px 20px!important}.portal-ad.moov{background:linear-gradient(110deg,#e20075,#7c0b55)!important}.portal-ad.local{background:linear-gradient(110deg,#087844,#0b4d2e)!important}@media(max-width:900px){.portal-ad-grid{grid-template-columns:1fr!important}.portal-ad{height:72px!important;min-height:72px!important}.portal-ad img{height:100%!important}}</style>'''
          if 'id="ciwara-pub-format"' not in s:
              s=s.replace(marker,css+marker,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/pub-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/pub-format.yml
          git commit -m 'Uniformisation des pastilles publicitaires' || exit 0
          git push
