name: Deploy Radio Ciwara site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radio-ciwara-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check script syntax
        run: node --check script.js

      - name: Validate JSON data
        run: |
          node -e "const fs=require('fs'); const files=['data/news.json','data/mali-radios.json','data/news-sources.json']; for(const f of files){if(!fs.existsSync(f)) throw new Error('Fichier manquant: '+f); JSON.parse(fs.readFileSync(f,'utf8'));} console.log('JSON OK')"

      - name: Verify essential site files
        run: |
          for f in index.html style.css script.js mali-radios.js mali-radios.css; do
            test -f "$f" || { echo "Fichier essentiel manquant: $f"; exit 1; }
          done
          echo "Fichiers essentiels OK"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
