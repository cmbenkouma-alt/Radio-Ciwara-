name: Deploy Radio Ciwara site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments. A fresh push creates a fresh run/artifact;
# cancelling an older in-progress deployment prevents artifact collisions.
concurrency:
  group: radio-ciwara-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check script syntax
        run: node --check script.js

      - name: Validate JSON data
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/news.json','utf8')); JSON.parse(require('fs').readFileSync('data/mali-radios.json','utf8')); JSON.parse(require('fs').readFileSync('data/news-sources.json','utf8')); JSON.parse(require('fs').readFileSync('data/radio-config.json','utf8')); JSON.parse(require('fs').readFileSync('data/schedule.json','utf8')); console.log('JSON OK')"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
