name: Ciwara hero player fix

on:
  push:
    paths:
      - '.github/workflows/ciwara-hero-player-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajuster le lecteur hero et le hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mali-radios.js')
          s = p.read_text()
          old = """.ciwara-caster-card{position:relative!important;border:2px solid #d71920!important;box-shadow:0 18px 48px rgba(0,0,0,.5),0 0 0 3px rgba(215,25,32,.12)!important;margin-left:-18px!important}"""
          new = """.ciwara-caster-card{position:relative!important;border:2px solid #d71920!important;box-shadow:0 18px 48px rgba(0,0,0,.5),0 0 0 3px rgba(215,25,32,.12)!important;margin-left:-18px!important}.ciwara-caster-card:before{content:'🎙️';position:absolute;inset:52px 0 0;display:grid;place-items:center;font-size:118px;opacity:.07;filter:grayscale(1);pointer-events:none;z-index:0}.ciwara-caster-card .player-title,.ciwara-caster-card .direct-player{position:relative;z-index:1}.ciwara-caster-card .direct-player{overflow:hidden!important}"""
          if old not in s:
              raise SystemExit('style cible introuvable')
          s = s.replace(old, new, 1)
          s = s.replace(".ciwara-player-tap-ring{left:auto!important;right:22px!important;top:24px!important;transform:none!important;width:62px!important;height:62px!important;opacity:.9!important}", ".ciwara-player-tap-ring{left:auto!important;right:22px!important;top:24px!important;transform:none!important;width:62px!important;height:62px!important;opacity:.9!important}", 1)
          p.write_text(s)

          h = Path('index.html')
          x = h.read_text()
          old_actions = '<div class="container ciwara-hero-actions"><button class="btn btn-red" data-play>▶ ÉCOUTER EN DIRECT</button><a class="btn btn-outline" href="#programmes">VOIR LA GRILLE</a><a class="btn btn-tv" href="ciwara-tv.html">CIWARA TV</a></div>'
          if old_actions not in x:
              raise SystemExit('bloc hero-actions introuvable')
          x = x.replace(old_actions, '', 1)
          marker = '<style>.ciwara-hero{'
          if marker not in x:
              raise SystemExit('style hero introuvable')
          x = x.replace(marker, '<style>.ciwara-caster-card:after{content:\'\';position:absolute;inset:52px 0 0;background:radial-gradient(circle at 50% 52%,rgba(215,25,32,.22),transparent 35%),url(\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 900 500%22%3E%3Cg fill=%22none%22 stroke=%22%23d71920%22 stroke-opacity=%22.16%22 stroke-width=%2212%22%3E%3Cpath d=%22M120 330c60-120 180-180 330-150 160 32 270 20 330-70%22/%3E%3Cpath d=%22M150 390c80-100 180-130 300-105 160 35 260 0 330-85%22/%3E%3C/g%3E%3Ccircle cx=%22450%22 cy=%22235%22 r=%2290%22/%3E%3Cpath d=%22M420 145h60v180h-60z%22/%3E%3C/svg%3E\') center/cover no-repeat;pointer-events:none;z-index:0;opacity:.8}.ciwara-hero{', 1)
          h.write_text(x)
          PY
      - name: Publier la correction
        run: |
          git config user.name 'Ciwara Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mali-radios.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Retravaille le cadre du lecteur et nettoie le hero"
          git push
