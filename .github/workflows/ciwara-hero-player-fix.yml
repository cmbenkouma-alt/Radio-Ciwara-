name: Ciwara hero player fix

on:
  push:
    paths:
      - '.github/workflows/ciwara-hero-player-fix.yml'
      - '.github/ciwara-hero-force-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transformer le panneau Hero en slider des emissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          h = Path('index.html')
          x = h.read_text(encoding='utf-8')

          slider = '''<div class="ciwara-emissions-slider" aria-label="Les émissions de Radio Ciwara 105.5 FM">
          <div class="ces-head"><div><span>PROGRAMMES RADIO CIWARA</span><b>LES ÉMISSIONS</b></div><strong>105.5 FM</strong></div>
          <div class="ces-track-wrap"><div class="ces-track">
          <article class="ces-slide"><span>LUNDI · 07:00 — 08:00</span><b>TOUR D’HORIZON</b><small>Actualités et informations</small></article>
          <article class="ces-slide"><span>LUNDI · 08:00 — 09:00</span><b>CIWARA MATIN</b><small>Infos · société · musique</small></article>
          <article class="ces-slide"><span>LUNDI · 10:00 — 11:30</span><b>REVUE DE LA PRESSE</b><small>Gaffé · commentaire des articles</small></article>
          <article class="ces-slide"><span>LUNDI · 11:30 — 13:00</span><b>BARONI SENSIBILISATION</b><small>Émission de sensibilisation</small></article>
          <article class="ces-slide"><span>LUNDI · 14:05 — 15:00</span><b>MOUNA POURQUOI</b><small>Magazine Ciwara</small></article>
          <article class="ces-slide"><span>LUNDI · 15:00 — 16:00</span><b>CIWARA SPORTS</b><small>Sport et actualités</small></article>
          <article class="ces-slide"><span>LUNDI · 16:00 — 17:00</span><b>SOUMOU</b><small>Émission musicale</small></article>
          <article class="ces-slide"><span>LUNDI · 17:00 — 18:00</span><b>CIWARA LOVE</b><small>Musique et interactivité</small></article>
          <article class="ces-slide"><span>LUNDI · 18:00 — 18:15</span><b>GRAND JOURNAL</b><small>Radio Ciwara FM 105.5</small></article>
          <article class="ces-slide"><span>MARDI · 14:05 — 15:00</span><b>FEMMES ET SOCIÉTÉ</b><small>Société · débats</small></article>
          <article class="ces-slide"><span>MERCREDI · 15:00 — 16:00</span><b>J’AIME MA COMMUNE</b><small>Vie locale et proximité</small></article>
          <article class="ces-slide"><span>SAMEDI · 15:00 — 16:00</span><b>HIT DE LA GUINÉE</b><small>Musique</small></article>
          <article class="ces-slide"><span>DIMANCHE · 17:00 — 18:00</span><b>CIWARA CONTES, HUMOUR ET RIRE</b><small>Divertissement</small></article>
          </div></div>
          <div class="ces-foot"><button type="button" class="ces-prev" aria-label="Emission précédente">‹</button><small>Défilement automatique</small><button type="button" class="ces-next" aria-label="Emission suivante">›</button></div>
          </div>'''

          pattern = r'<div class="ciwara-youtube-frame">.*?</div><p class="ciwara-hero-caption">.*?</p>'
          x, n = re.subn(pattern, slider + '<p class="ciwara-hero-caption">Programmes et émissions de Radio Ciwara 105.5 FM</p>', x, count=1, flags=re.S)
          if n == 0:
              raise SystemExit('Panneau Hero YouTube introuvable')

          css = '''<style id="ciwara-emissions-slider-style">.ciwara-emissions-slider{position:relative;width:100%;border:2px solid #f7d51b;border-radius:10px;overflow:hidden;background:linear-gradient(145deg,#101214,#087f3f);box-shadow:0 12px 30px rgba(0,0,0,.42);color:#fff}.ces-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid rgba(247,213,27,.35)}.ces-head span{display:block;color:#f7d51b;font:900 8px Montserrat;letter-spacing:.8px}.ces-head b{display:block;font:900 16px Montserrat;margin-top:3px}.ces-head strong{font:900 9px Montserrat;color:#f7d51b}.ces-track-wrap{overflow:hidden}.ces-track{display:flex;width:max-content;animation:ciwaraEmissionSlide 42s linear infinite}.ciwara-emissions-slider:hover .ces-track{animation-play-state:paused}.ces-slide{width:285px;min-height:142px;box-sizing:border-box;padding:20px 16px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(0,0,0,.13));border-right:1px solid rgba(255,255,255,.12)}.ces-slide span{color:#f7d51b;font:900 8px Montserrat}.ces-slide b{font:900 17px/1.15 Montserrat;margin:7px 0}.ces-slide small{color:#d7d7d7;font:500 10px Roboto}.ces-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-top:1px solid rgba(255,255,255,.12)}.ces-foot button{width:30px;height:30px;border:1px solid #f7d51b;background:#111214;color:#fff;border-radius:50%;font-size:20px;line-height:1;cursor:pointer}.ces-foot small{font:700 8px Montserrat;color:#ccc}@keyframes ciwaraEmissionSlide{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}@media(max-width:650px){.ces-slide{width:250px;min-height:130px}.ces-head b{font-size:14px}} </style>'''
          if 'ciwara-emissions-slider-style' not in x:
              x=x.replace('</head>',css+'\n</head>',1)

          script = '''<script id="ciwara-emissions-slider-script">(()=>{const s=document.querySelector('.ciwara-emissions-slider');if(!s)return;const t=s.querySelector('.ces-track');if(!t)return;const cards=[...t.children];t.innerHTML=cards.map(c=>c.outerHTML).join('')+cards.map(c=>c.outerHTML).join('');const prev=s.querySelector('.ces-prev'),next=s.querySelector('.ces-next');const step=()=>{s.querySelector('.ces-track').style.animation='none';s.querySelector('.ces-track').offsetHeight;s.querySelector('.ces-track').style.animation='ciwaraEmissionSlide 42s linear infinite'};prev.onclick=()=>{s.querySelector('.ces-track-wrap').scrollBy({left:-300,behavior:'smooth'});step()};next.onclick=()=>{s.querySelector('.ces-track-wrap').scrollBy({left:300,behavior:'smooth'});step()};})();</script>'''
          if 'ciwara-emissions-slider-script' not in x:
              x=x.replace('</body>',script+'\n</body>',1)

          h.write_text(x,encoding='utf-8')
          PY
      - name: Publier la correction
        run: |
          git config user.name 'Ciwara Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: afficher les emissions dans le slider du hero'
          git push
