<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 85" role="img" aria-labelledby="title desc" preserveAspectRatio="none">
<title id="title">Karim Konaré Dolo Karamoko — Géomancien</title>
<desc id="desc">Bannière Radio Ciwara pour Karim Konaré Dolo Karamoko, géomancien et astrologue.</desc>
<defs>
