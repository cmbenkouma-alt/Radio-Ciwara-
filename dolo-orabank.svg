  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#fff06a"/><stop offset="1" stop-color="#ffd000"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".55"/></filter>
  <clipPath id="portrait"><circle cx="58" cy="42" r="34"/></clipPath>
</defs>
<rect width="1180" height="85" rx="8" fill="url(#bg)"/>
