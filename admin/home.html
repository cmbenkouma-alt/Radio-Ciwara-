<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accueil — CMS Ciwara</title><style>body{font:14px Arial;background:#f5f7fb;color:#172033;margin:0}.top{background:#111827;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto;padding:0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:0;border-radius:8px;padding:11px 14px;font-weight:800;cursor:pointer}.tabs .on{background:#e81e4d;color:#fff}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px}.field textarea{min-height:100px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#e81e4d;color:#fff}.secondary{background:#e9eef5}.item{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:12px}.item b{display:block;margin-bottom:4px}.item small{color:#64748b}.login{max-width:400px;margin:80px auto;background:#fff;padding:25px;border-radius:14px}.ok{background:#e9f8ef;padding:10px;border-radius:8px}.err{background:#fff0f0;padding:10px;border-radius:8px}.hidden{display:none!important}.danger{background:#111827;color:#fff}</style></head><body><div id="login" class="login"><h1>Accueil — CMS Ciwara</h1><p>Connexion avec le même compte que le CMS principal.</p><div class="field"><label>Mot de passe</label><input id="pw" type="password"></div><button class="btn primary" id="connect">Se connecter</button><p id="msg"></p></div><div id="app" class="hidden"><div class="top"><div class="wrap"><b>CIWARA ADMIN · ACCUEIL AVANCÉ</b></div></div><main class="wrap"><div class="tabs"><button data-tab="hero">1. Hero</button><button data-tab="slider">2. Actualité Mali & monde</button><button data-tab="sidebar">3. Bloc de droite</button><button data-tab="facebook">4. Facebook Live</button><a class="btn secondary" href="./">← CMS principal</a></div><section class="panel"><div id="content"></div></section></main></div><script>'use strict';const API='https://radio-ciwara-admin-api.cmbenkouma.workers.dev',KEY='ciwara_admin_token',$=x=>document.getElementById(x),tok=()=>sessionStorage.getItem(KEY);async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+tok()};if(o.body)o.headers['Content-Type']='application/json';const r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function connect(){try{const r=await fetch(API+'/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Connexion refusée');sessionStorage.setItem(KEY,d.token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');openTab('hero')}catch(e){$('#msg').textContent=e.message;$('#msg').className='err'}}$('#connect').onclick=connect;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(path){return api('/file?path='+encodeURIComponent(path))}async function save(path,data,sha){return api('/file',{method:'PUT',body:JSON.stringify({path,data,sha,message:'admin: accueil avancé'})})}function field(n,l,v,t='text'){return `<div class="field"><label>${l}</label>${t==='textarea'?`<textarea id="f_${n}">${esc(v)}</textarea>`:`<input id="f_${n}" type="${t}" value="${esc(v)}">`}</div>`}async function hero(){const d=await load('data/hero.json'),x=d.data;$('content').innerHTML=`<h2>Gestion complète du Hero</h2>${field('eyebrow','Petit titre',x.eyebrow)}${field('title','Grand titre',x.title)}${field('text','Texte',x.text,'textarea')}${field('image','Image',x.image)}${field('buttonText','Bouton principal',x.buttonText)}${field('buttonLink','Lien principal',x.buttonLink)}${field('secondaryText','Second bouton',x.secondaryText)}${field('secondaryLink','Lien secondaire',x.secondaryLink)}<div class="actions"><button class="btn primary" id="save">Enregistrer le Hero</button></div>`;$('#save').onclick=async()=>{Object.keys(x).forEach(k=>{const e=$('#f_'+k);if(e)x[k]=e.value});await save('data/hero.json',x,d.sha);alert('Hero enregistré dans GitHub.')}}async function list(path,title,fields){const d=await load(path),items=d.data.items||[];function render(){let html=`<h2>${title}</h2><p>Ajoute, modifie, supprime et réorganise les éléments.</p><div id="items">`;items.forEach((x,i)=>html+=`<div class="item"><div><b>${esc(x.title||x.name||('Élément '+(i+1)))}</b><small>${esc(x.category||x.text||x.description||'')}</small></div><div><button class="btn secondary" onclick="editItem(${i})">Modifier</button> <button class="btn danger" onclick="removeItem(${i})">Supprimer</button></div></div>`);html+='</div><button class="btn primary" id="add">+ Ajouter</button>';$('#content').innerHTML=html;$('#add').onclick=()=>editItem(-1)}window.editItem=async i=>{const x=i<0?{active:true,order:items.length+1}:{...items[i]};let html='<h2>'+(i<0?'Ajouter':'Modifier')+'</h2>';for(const [n,l,t] of fields)html+=field(n,l,x[n],t);html+='<div class="actions"><button class="btn primary" id="saveItem">Enregistrer</button></div>';$('#content').innerHTML=html;$('#saveItem').onclick=async()=>{for(const [n] of fields){const e=$('#f_'+n);if(e)x[n]=e.value}if(i<0)items.push(x);else items[i]=x;await save(path,{...d.data,items},d.sha);list(path,title,fields)}};window.removeItem=async i=>{if(!confirm('Supprimer cet élément ?'))return;items.splice(i,1);await save(path,{...d.data,items},d.sha);list(path,title,fields)};render()}async function facebook(){const d=await load('data/facebook-live.json'),x=d.data;$('content').innerHTML=`<h2>Gestion Facebook Live</h2>${field('enabled','Activé (true/false)',x.enabled)}${field('title','Titre',x.title)}${field('url','URL Facebook',x.url)}${field('embedUrl','URL du lecteur intégré Facebook',x.embedUrl)}${field('height','Hauteur du lecteur',x.height,'number')}<div class="actions"><button class="btn primary" id="save">Enregistrer</button></div><p class="ok">Tu peux ajouter ici l’URL de ta vidéo/live Facebook ou l’URL d’intégration. Le bloc sera affiché uniquement lorsque Activé = true.</p>`;$('#save').onclick=async()=>{x.enabled=$('#f_enabled').value==='true';x.title=$('#f_title').value;x.url=$('#f_url').value;x.embedUrl=$('#f_embedUrl').value;x.height=Number($('#f_height').value)||420;await save('data/facebook-live.json',x,d.sha);alert('Facebook Live enregistré.')}}async function openTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));try{if(t==='hero')await hero();if(t==='slider')await list('data/actualites-slider.json','Slider Actualité du Mali et du monde',[['title','Titre'],['category','Catégorie'],['description','Résumé','textarea'],['image','Image'],['link','Lien'],['active','Visible'],['order','Ordre','number']]);if(t==='sidebar')await list('data/sidebar.json','Bloc de droite — éléments',[['title','Titre'],['text','Texte','textarea'],['image','Image'],['link','Lien'],['active','Visible'],['order','Ordre','number']]);if(t==='facebook')await facebook()}catch(e){$('#content').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));if(tok()){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');openTab('hero')}</script></body></html>
