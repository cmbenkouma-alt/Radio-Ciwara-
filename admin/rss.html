<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flux RSS — CMS Ciwara</title><style>body{font:14px Arial;background:#f5f7fb;color:#172033;margin:0}.top{background:#111827;color:#fff;padding:18px}.wrap{max-width:1050px;margin:auto;padding:0 18px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px;margin:22px 0}.item{border:1px solid #e2e8f0;border-radius:10px;padding:15px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#e81e4d;color:#fff}.secondary{background:#e9eef5;color:#172033}.ok{background:#e9f8ef;padding:10px;border-radius:8px}.err{background:#fff0f0;padding:10px;border-radius:8px}.hidden{display:none!important}.login{max-width:400px;margin:80px auto;background:#fff;padding:25px;border-radius:14px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><h1>Flux RSS — CMS Ciwara</h1><p>Configure Maliweb et Malijet sans modifier le code du site.</p><div class="field"><label>Mot de passe</label><input id="pw" type="password"></div><button class="btn primary" id="connect">Se connecter</button><p id="msg"></p></div><div id="app" class="hidden"><div class="top"><div class="wrap"><b>CIWARA ADMIN · FLUX RSS</b></div></div><main class="wrap"><section class="panel"><h2>Revue de presse externe</h2><p>Ces flux sont indépendants de <b>CIWARA INFOS</b>, qui reste ton propre journal.</p><div id="sources"></div><div><button class="btn primary" id="save">Enregistrer les flux</button> <a class="btn secondary" href="home.html">← Accueil CMS</a></div><p id="msg2"></p></section></main></div><script>'use strict';const API='https://radio-ciwara-admin-api.cmbenkouma.workers.dev',KEY='ciwara_admin_token',$=x=>document.getElementById(x),tok=()=>sessionStorage.getItem(KEY);async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+tok()};if(o.body)o.headers['Content-Type']='application/json';const r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function connect(){try{const r=await fetch(API+'/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Connexion refusée');sessionStorage.setItem(KEY,d.token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}catch(e){$('#msg').textContent=e.message;$('#msg').className='err'}}$('#connect').onclick=connect;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const d=await api('/file?path='+encodeURIComponent('data/news-sources.json'));const sources=d.data.sources||[];$('#sources').innerHTML=sources.map((x,i)=>`<div class="item"><div class="row"><div class="field"><label>Nom</label><input id="n_${i}" value="${esc(x.name)}"></div><div class="field"><label>Flux RSS</label><input id="f_${i}" value="${esc(x.feed)}"></div><div class="field"><label>Activé</label><input id="e_${i}" value="${x.enabled!==false?'true':'false'}"></div></div><div class="field"><label>Site</label><input id="s_${i}" value="${esc(x.site||'')}"></div></div>`).join('');window._sources=sources;window._sha=d.sha}catch(e){$('#sources').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}async function save(){try{const sources=window._sources||[];sources.forEach((x,i)=>{x.name=$('#n_'+i).value;x.feed=$('#f_'+i).value;x.site=$('#s_'+i).value;x.enabled=$('#e_'+i).value.toLowerCase()==='true'});await api('/file',{method:'PUT',body:JSON.stringify({path:'data/news-sources.json',data:{sources},sha:window._sha,message:'admin: gestion flux RSS'})});$('#msg2').textContent='Flux RSS enregistrés dans GitHub.';$('#msg2').className='ok';load()}catch(e){$('#msg2').textContent=e.message;$('#msg2').className='err'}}$('#save').onclick=save;if(tok()){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}</script></body></html>
