<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Ciwara</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#151515}.top{background:#111;color:#fff;padding:22px}.top b{color:#f7d51b}.wrap{max-width:1180px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:240px 1fr;gap:18px}.nav,.panel{background:#fff;border:1px solid #ddd;border-radius:12px}.nav button{display:block;width:100%;padding:13px 15px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;cursor:pointer;font-weight:700}.nav button.active{background:#d71920;color:#fff}.panel{padding:22px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:7px;font:inherit}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:18px}button.primary{background:#d71920;color:#fff;border:0;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#eee;border:0;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer}.status{padding:11px;border-radius:7px;background:#f1f1f1;margin-bottom:18px;font-size:13px}.hint{font-size:12px;color:#666}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="wrap"><h1>Administration Ciwara</h1><div>Gestion globale de <b>Radio Ciwara 105.5 FM</b> et <b>Ciwara Infos</b></div></div></header><main class="wrap"><div id="status" class="status">Prêt. L'administration est connectée au Worker.</div><div class="grid"><aside class="nav" id="nav"></aside><section class="panel"><h2 id="title">Tableau de bord</h2><p id="intro" class="hint">Sélectionnez une rubrique.</p><form id="form"></form></section></div></main><script>const API='https://radio-ciwara-admin-api.cmbenkouma.workers.dev';const sections={dashboard:{title:'Tableau de bord',intro:'Vue générale du contenu du site.',fields:[]},infos:{title:'Ciwara Infos',intro:'Articles, images, catégories et publication.',fields:[['title','Titre de l’article','input'],['description','Résumé / contenu','textarea'],['image','URL de l’image','input'],['link','Lien de l’article','input'],['source','Source','input'],['date','Date','input']]},radio:{title:'Radio Ciwara',intro:'Identité et informations de la station.',fields:[['station','Nom de la radio','input'],['frequency','Fréquence','input'],['slogan','Slogan','input'],['presentation','Présentation','textarea'],['stream','Flux radio','input']]},programmes:{title:'Programmes',intro:'Émissions, animateurs et horaires.',fields:[['name','Nom de l’émission','input'],['host','Animateur','input'],['schedule','Horaire','input'],['description','Description','textarea'],['image','Image','input']]},podcasts:{title:'Podcasts',intro:'Épisodes et contenus audio.',fields:[['title','Titre','input'],['description','Description','textarea'],['audio','URL audio','input'],['image','Image','input']]},tv:{title:'Ciwara TV',intro:'Vidéos et contenus TV.',fields:[['title','Titre vidéo','input'],['description','Description','textarea'],['video','URL vidéo','input'],['image','Miniature','input']]},publicites:{title:'Publicités',intro:'Bannières et campagnes.',fields:[['title','Nom','input'],['image','Image / bannière','input'],['link','Lien','input'],['active','Active','select']]},partenaires:{title:'Partenaires',intro:'Radios et partenaires.',fields:[['name','Nom','input'],['logo','Logo','input'],['link','Site / lien','input'],['description','Description','textarea']]},accueil:{title:'Accueil',intro:'Textes, blocs et ordre de présentation.',fields:[['heroTitle','Titre principal','input'],['heroText','Texte principal','textarea'],['alert','Alerte info','input'],['metaDescription','Description SEO','textarea']]},seo:{title:'SEO',intro:'Référencement et partage social.',fields:[['title','Titre SEO','input'],['description','Description SEO','textarea'],['canonical','URL canonique','input'],['ogImage','Image sociale','input']]},parametres:{title:'Paramètres',intro:'Réglages éditoriaux généraux.',fields:[['adminOrigin','Origine autorisée','input'],['timezone','Fuseau horaire','input'],['contact','Contact','input'],['social','Réseaux sociaux','textarea']]}};const nav=document.getElementById('nav');Object.entries(sections).forEach(([key,s])=>{const b=document.createElement('button');b.textContent=s.title;b.onclick=()=>show(key);nav.appendChild(b)});function show(key){const s=sections[key];document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',Object.keys(sections)[i]===key));document.getElementById('title').textContent=s.title;document.getElementById('intro').textContent=s.intro;const f=document.getElementById('form');f.innerHTML='';if(!s.fields.length){f.innerHTML='<p>Le Worker peut maintenant servir de point central pour piloter les contenus. Les prochaines données seront structurées sans modifier le lecteur Caster.fm.</p>';return}s.fields.forEach(([name,label,type])=>{const d=document.createElement('div');d.className='field';d.innerHTML='<label>'+label+'</label>'+(type==='textarea'?'<textarea name="'+name+'"></textarea>':type==='select'?'<select name="'+name+'"><option value="1">Oui</option><option value="0">Non</option></select>':'<input name="'+name+'">');f.appendChild(d)});const a=document.createElement('div');a.className='actions';a.innerHTML='<button class="primary" type="button" id="save">Enregistrer</button><button class="secondary" type="button" id="reload">Recharger</button>';f.appendChild(a);document.getElementById('save').onclick=()=>save(key);document.getElementById('reload').onclick=()=>load(key)}async function load(key){try{const r=await fetch(API+'/api/content?section='+encodeURIComponent(key));if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const form=document.getElementById('form');Object.entries(data||{}).forEach(([k,v])=>{const e=form.elements[k];if(e)e.value=v})}catch(e){document.getElementById('status').textContent='Lecture Worker non disponible : '+e.message}}async function save(key){const payload={section:key};document.querySelectorAll('#form [name]').forEach(e=>payload[e.name]=e.value);const st=document.getElementById('status');st.textContent='Enregistrement…';try{const r=await fetch(API+'/api/content',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const text=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' — '+text);st.textContent='Contenu enregistré avec succès.'}catch(e){st.textContent='Enregistrement impossible : '+e.message}}show('dashboard');</script></body></html>
