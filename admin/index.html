<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Ciwara</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#161616}.top{background:#111;color:#fff;padding:18px 24px}.top .wrap{display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1280px;margin:auto}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px;padding:22px}.nav,.panel,.login{background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 3px 16px #0000000a}.nav{overflow:hidden;height:max-content;position:sticky;top:20px}.nav button{display:block;width:100%;padding:13px 15px;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;cursor:pointer;font-weight:700}.nav button.active{background:#e81e4d;color:#fff}.panel{padding:22px;min-height:650px}.status{padding:11px 13px;border-radius:8px;background:#f1f2f4;margin-bottom:18px;font-size:13px}.ok{background:#e9f8ef;color:#17643a}.err{background:#fff0f0;color:#9a1b1b}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font:inherit}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}button.primary,button.danger,button.secondary,.upload{border:0;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer}.primary{background:#e81e4d;color:#fff}.secondary{background:#eee}.danger{background:#1d1d1d;color:#fff}.upload{background:#222;color:#fff;display:inline-block}.cards{display:grid;gap:10px;margin:18px 0}.card{border:1px solid #ddd;border-radius:10px;padding:13px;background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center}.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0;color:#666;font-size:12px}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);padding:28px}.hidden{display:none!important}.hint{font-size:12px;color:#666}.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid #ddd;border-radius:10px;padding:18px}.stat b{font-size:28px;display:block;margin-top:5px}.preview{max-width:180px;max-height:100px;object-fit:cover;border-radius:7px;margin-top:7px}.checkrow{display:flex;gap:9px;align-items:center}.checkrow input{width:auto}.mini{font-size:11px;color:#777}.reorder{display:flex;gap:4px}.reorder button{border:1px solid #ddd;background:#fff;border-radius:6px;padding:5px 8px;cursor:pointer}@media(max-width:800px){.layout{grid-template-columns:1fr}.nav{position:static}.dash{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="loginView" class="login-screen"><form class="login" id="loginForm"><h1>Administration Ciwara</h1><p class="hint">CMS global sécurisé de Radio Ciwara 105.5 FM.</p><div class="field"><label>Mot de passe administrateur</label><input id="password" type="password" required></div><button class="primary" style="width:100%">Se connecter</button><p id="loginMsg" class="hint"></p></form></div>
<div id="app" class="hidden"><header class="top"><div class="wrap"><strong>CIWARA ADMIN — 105.5 FM</strong><button id="logout" class="secondary">Déconnexion</button></div></header><main class="wrap layout"><aside class="nav" id="nav"></aside><section class="panel"><div id="status" class="status">Connecté.</div><h2 id="title">Tableau de bord</h2><p id="intro" class="hint"></p><div id="content"></div></section></main></div>
<script>
const API='https://radio-ciwara-admin-api.cmbenkouma.workers.dev',KEY='ciwara_admin_token';const $=id=>document.getElementById(id);
const C={
 infos:['Ciwara Infos','data/news.json',{title:['Titre','text'],description:['Résumé / contenu','textarea'],image:['Image','image'],category:['Catégorie','text'],link:['Lien article','text'],source:['Source','text'],date:['Date','text'],order:['Ordre','number'],featured:['À la une','check'],published:['Publié','check']}],
 programmes:['Programmes','data/programmes.json',{name:['Émission','text'],host:['Animateur','text'],schedule:['Horaire','text'],description:['Description','textarea'],image:['Image','image'],active:['Active','check']}],
 podcasts:['Podcasts','data/podcasts.json',{title:['Titre','text'],description:['Description','textarea'],audio:['URL audio','text'],image:['Image','image'],active:['Publié','check']}],
 tv:['Ciwara TV','data/tv.json',{title:['Titre vidéo','text'],description:['Description','textarea'],video:['URL vidéo','text'],image:['Miniature','image'],active:['Publié','check']}],
 publicites:['Publicités','data/publicites.json',{title:['Campagne','text'],image:['Bannière','image'],link:['Lien','text'],active:['Active','check']}],
 partenaires:['Partenaires','data/partenaires.json',{name:['Nom','text'],logo:['Logo','image'],link:['Site / lien','text'],description:['Description','textarea'],active:['Visible','check']}],
 radio:['Radio','data/site-settings.json',{station:['Nom','text'],frequency:['Fréquence','text'],slogan:['Slogan','text'],presentation:['Présentation','textarea']}],
 accueil:['Accueil','data/accueil.json',{heroTitle:['Titre principal','text'],heroText:['Texte principal','textarea'],alert:['Alerte / breaking news','text'],featuredOrder:['Ordre des articles à la une','textarea']}],
 seo:['SEO','data/seo.json',{title:['Titre SEO','text'],description:['Description SEO','textarea'],canonical:['URL canonique','text'],ogImage:['Image Open Graph','image']}]
};
const tok=()=>sessionStorage.getItem(KEY);function status(t,c=''){$('status').textContent=t;$('status').className='status '+c}
async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+tok()};if(o.body&&!o.headers['Content-Type'])o.headers['Content-Type']='application/json';const r=await fetch(API+p,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Connexion…';try{const r=await fetch(API+'/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Connexion refusée');sessionStorage.setItem(KEY,d.token);start()}catch(x){$('loginMsg').textContent=x.message}};$('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};
function start(){if(!tok())return;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('nav').innerHTML='<button data-k="dashboard">Tableau de bord</button>'+Object.entries(C).map(([k,v])=>'<button data-k="'+k+'">'+v[0]+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.k));show('dashboard')}
function active(k){$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.k===k))}
async function show(k){active(k);if(k==='dashboard'){dashboard();return}const c=C[k];$('title').textContent=c[0];$('intro').textContent='Gestion directe du contenu. Les modifications sont écrites dans GitHub sans toucher au lecteur Caster.fm.';try{const d=await api('/file?path='+encodeURIComponent(c[1]));if(['radio','accueil','seo'].includes(k))objectEditor(k,c,d);else listEditor(k,c,d)}catch(e){status('Erreur : '+e.message,'err')}}
async function dashboard(){active('dashboard');$('title').textContent='Tableau de bord';$('intro').textContent='Pilotage centralisé du site, des médias et de la Une.';$('content').innerHTML='<div class="dash"><div class="stat">Articles<b id="a">—</b></div><div class="stat">Programmes<b id="p">—</b></div><div class="stat">Podcasts<b id="q">—</b></div><div class="stat">Vidéos<b id="v">—</b></div></div><div class="panel" style="margin-top:18px;padding:16px"><b>Protection</b><p class="hint">Caster.fm reste strictement intact. Les images sont envoyées dans <code>assets/uploads/</code>. Vous pouvez gérer textes, médias, Une, TV, pubs, partenaires, radio et SEO ici.</p></div>';try{$('a').textContent=(await api('/file?path=data/news.json')).data.items.length;$('p').textContent=(await api('/file?path=data/programmes.json')).data.items.length;$('q').textContent=(await api('/file?path=data/podcasts.json')).data.items.length;$('v').textContent=(await api('/file?path=data/tv.json')).data.items.length;status('Données chargées.','ok')}catch(e){status(e.message,'err')}}
function fields(form,s,obj){Object.entries(s).forEach(([n,m])=>{const d=document.createElement('div');d.className='field';d.innerHTML='<label>'+m[0]+'</label>';let e;if(m[1]==='textarea')e=document.createElement('textarea');else{e=document.createElement('input');if(m[1]==='check')e.type='checkbox';if(m[1]==='number')e.type='number'}e.name=n;if(m[1]==='check')e.checked=obj[n]!==false;else e.value=obj[n]??'';d.appendChild(e);if(m[1]==='image'){const row=document.createElement('div');row.className='actions';const b=document.createElement('label');b.className='upload';b.textContent='Choisir / envoyer une image';const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,image/gif,image/svg+xml';file.hidden=true;b.appendChild(file);b.onclick=()=>file.click();file.onchange=()=>uploadImage(file,e);row.appendChild(b);d.appendChild(row);if(obj[n]){const im=document.createElement('img');im.className='preview';im.src=obj[n];im.onerror=()=>im.style.display='none';d.appendChild(im)}}if(m[1]==='check'){const wrap=document.createElement('div');wrap.className='mini';wrap.textContent='Activé = visible sur le site';d.appendChild(wrap)}form.appendChild(d)})}
async function uploadImage(file,input){if(!file.files[0])return;const f=file.files[0];if(f.size>8*1024*1024)return alert('Image trop volumineuse : 8 Mo maximum.');const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace('jpeg','jpg');const safe=f.name.replace(/[^a-zA-Z0-9_.-]/g,'-').replace(/\.+/g,'.');const path='assets/uploads/'+Date.now()+'-'+safe.replace(/\.(jpg|jpeg|png|webp|gif|svg)$/i,'.'+ext);status('Envoi de l’image dans GitHub…');const reader=new FileReader();reader.onload=async()=>{try{const base=String(reader.result).split(',')[1];const r=await api('/image',{method:'POST',body:JSON.stringify({path,contentBase64:base,message:'admin: upload '+f.name})});input.value=r.path;status('Image envoyée : '+r.path,'ok');const img=input.parentElement.querySelector('.preview');if(img)img.src=r.path;else{const im=document.createElement('img');im.className='preview';im.src=r.path;input.parentElement.appendChild(im)}}catch(e){status('Upload impossible : '+e.message,'err')}};reader.readAsDataURL(f)}
function read(form,s){const o={};Object.entries(s).forEach(([n,m])=>o[n]=m[1]==='check'?form.elements[n].checked:m[1]==='number'?(form.elements[n].value===''?0:Number(form.elements[n].value)):form.elements[n].value);return o}
function objectEditor(k,c,d){$('content').innerHTML='<form id="f"></form><div class="actions"><button class="primary" id="save">Enregistrer</button><button class="secondary" id="reload">Recharger</button></div>';fields($('f'),c[2],d.data);$('save').onclick=async()=>{try{await write(c[1],read($('f'),c[2]),d.sha,'admin: modifier '+k);show(k)}catch(e){status(e.message,'err')}};$('reload').onclick=()=>show(k)}
function listEditor(k,c,d){const items=d.data.items||[];$('content').innerHTML='<div class="actions"><button class="primary" id="add">+ Ajouter</button><button class="secondary" id="refresh">Recharger</button><button class="secondary" id="sort">Trier par ordre</button></div><div id="cards" class="cards"></div><div id="editor"></div>';const cards=$('cards');items.forEach((it,i)=>{const x=document.createElement('div');x.className='card';x.innerHTML='<div><h3>'+esc(it.title||it.name||('Élément '+(i+1)))+'</h3><p>'+esc(it.category||it.source||it.host||it.schedule||it.description||'')+(it.featured?' · ⭐ À LA UNE':'')+'</p></div><div class="reorder"><button title="Monter">↑</button><button title="Descendre">↓</button><button class="secondary e">Modifier</button><button class="danger r">Supprimer</button></div>';x.querySelectorAll('.reorder button')[0].onclick=()=>move(k,c,d,i,-1);x.querySelectorAll('.reorder button')[1].onclick=()=>move(k,c,d,i,1);x.querySelector('.e').onclick=()=>edit(k,c,d,i);x.querySelector('.r').onclick=()=>del(k,c,d,i);cards.appendChild(x)});if(!items.length)cards.innerHTML='<p class="hint">Aucun élément.</p>';$('add').onclick=()=>edit(k,c,d,-1);$('refresh').onclick=()=>show(k);$('sort').onclick=()=>{d.data.items.sort((a,b)=>(Number(a.order)||9999)-(Number(b.order)||9999));show(k)}}
function edit(k,c,d,i){const obj=i<0?{active:true,published:true,featured:false,order:i<0?(d.data.items.length+1):0}:{...d.data.items[i]};$('editor').innerHTML='<form id="ef"></form><div class="actions"><button class="primary" id="saveItem">Enregistrer</button><button class="secondary" id="cancel">Annuler</button></div>';fields($('ef'),c[2],obj);$('saveItem').onclick=async()=>{const v=read($('ef'),c[2]);if(k==='infos'){v.order=Number(v.order)||0}if(i<0)d.data.items.push(v);else d.data.items[i]=v;try{await write(c[1],d.data,d.sha,'admin: '+(i<0?'ajouter':'modifier')+' '+k);show(k)}catch(e){status(e.message,'err')}};$('cancel').onclick=()=>show(k)}
function move(k,c,d,i,delta){const j=i+delta;if(j<0||j>=d.data.items.length)return;[d.data.items[i],d.data.items[j]]=[d.data.items[j],d.data.items[i]];d.data.items.forEach((x,n)=>{if('order'in x)x.order=n+1});write(c[1],d.data,d.sha,'admin: réordonner '+k).then(()=>show(k)).catch(e=>status(e.message,'err'))}
async function del(k,c,d,i){if(!confirm('Supprimer cet élément ?'))return;d.data.items.splice(i,1);try{await write(c[1],d.data,'', 'admin: supprimer '+k,d.sha);show(k)}catch(e){status(e.message,'err')}}
async function write(path,data,sha,message){status('Enregistrement GitHub…');await api('/file',{method:'PUT',body:JSON.stringify({path,data,sha,message})});status('Enregistré dans GitHub.','ok')}
function esc(s){return String(s??'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','\"':'&quot;',"'":'&#39;'}[x]))}
if(tok())start();
</script></body></html>
