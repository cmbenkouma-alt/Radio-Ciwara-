<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — Radio Ciwara</title>
<style>
:root{--red:#e81e4d;--dark:#111827;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:14px Inter,Arial,sans-serif}.hidden{display:none!important}.wrap{max-width:1400px;margin:auto;padding:0 20px}.top{height:68px;background:var(--dark);color:#fff;display:flex;align-items:center}.top .wrap{width:100%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.3px}.brand small{display:block;color:#cbd5e1;font-weight:600;font-size:11px;margin-top:3px}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;padding-top:20px;padding-bottom:30px}.nav,.panel,.login{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 24px #0f172a0a}.nav{height:max-content;position:sticky;top:16px;overflow:hidden}.nav button{display:flex;width:100%;border:0;border-bottom:1px solid #eef2f7;background:#fff;color:#334155;padding:13px 15px;text-align:left;font-weight:800;cursor:pointer}.nav button:hover{background:#f8fafc}.nav button.active{background:var(--red);color:#fff}.panel{padding:24px;min-height:700px}.status{padding:11px 13px;border-radius:9px;background:#f1f5f9;color:#475569;margin-bottom:18px;font-size:13px}.status.ok{background:#e9f8ef;color:#17643a}.status.err{background:#fff0f0;color:#9a1b1b}.hint{color:var(--muted);font-size:12px;line-height:1.55}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.head h1{font-size:24px;margin:0 0 5px}.head p{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#e9eef5;color:#243247}.danger{background:#111827;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:700}.stat b{font-size:28px;display:block;margin-top:6px}.cards{display:grid;gap:10px;margin-top:15px}.card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;display:flex;justify-content:space-between;gap:15px;align-items:center}.card-main{min-width:0}.card h3{margin:0 0 5px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:650px}.card-tools{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.icon{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;cursor:pointer;font-weight:800}.editor{margin-top:18px;border:1px solid var(--line);border-radius:13px;padding:18px;background:#f8fafc}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px;color:#334155}.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:11px;font:inherit;background:#fff}.field textarea{min-height:110px;resize:vertical}.check{display:flex!important;gap:9px;align-items:center}.check input{width:auto!important}.preview{display:block;max-width:220px;max-height:120px;object-fit:cover;border-radius:8px;margin-top:9px;border:1px solid var(--line)}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);padding:30px}.login h1{margin:0 0 8px}.login .logo{width:54px;height:54px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;margin-bottom:18px}.upload{display:inline-block;background:#111827;color:#fff;padding:9px 12px;border-radius:8px;font-weight:800;cursor:pointer}.upload input{display:none}.search{max-width:320px}.search input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2f7;color:#475569;font-size:10px;font-weight:800;margin-left:5px}.pill.on{background:#e9f8ef;color:#17643a}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px}.protect{margin-top:18px;padding:16px;border-radius:12px;background:#fff8e7;border:1px solid #f4d58b;color:#674d0c}.protect b{display:block;margin-bottom:4px}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{position:static}.grid{grid-template-columns:repeat(2,1fr)}.card{align-items:flex-start;flex-direction:column}.card-tools{justify-content:flex-start}}@media(max-width:520px){.wrap{padding:0 12px}.panel{padding:16px}.grid{grid-template-columns:1fr}.top{height:auto;padding:14px 0}.head{flex-direction:column}.search{max-width:none;width:100%}}
</style>
</head>
<body>
<div id="loginView" class="login-screen"><form class="login" id="loginForm"><div class="logo">C</div><h1>Administration Ciwara</h1><p class="hint">CMS global de Radio Ciwara 105.5 FM. Les contenus sont enregistrés dans GitHub.</p><div class="field"><label for="password">Mot de passe administrateur</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Se connecter</button><p id="loginMsg" class="hint"></p></form></div>
<div id="app" class="hidden"><header class="top"><div class="wrap"><div class="brand">CIWARA ADMIN <small>105.5 FM · Gestion du site</small></div><button id="logout" class="btn secondary">Déconnexion</button></div></header><main class="wrap layout"><aside class="nav" id="nav"></aside><section class="panel"><div id="status" class="status">Connecté.</div><div class="head"><div><h1 id="title">Tableau de bord</h1><p id="intro" class="hint"></p></div><div id="searchBox" class="search hidden"><input id="filter" placeholder="Rechercher…"></div></div><div id="content"></div></section></main></div>
<script>
'use strict';
const API='https://radio-ciwara-admin-api.cmbenkouma.workers.dev',KEY='ciwara_admin_token', $=id=>document.getElementById(id);
const C={
 infos:['Ciwara Infos','data/news.json',{title:['Titre','text'],description:['Résumé / contenu','textarea'],image:['Image','image'],category:['Catégorie','text'],link:['Lien article','text'],source:['Source','text'],date:['Date','text'],edition:['Parution / édition','text'],page:['Page','number'],order:['Ordre','number'],featured:['À la une','check'],published:['Publié','check']}],
 programmes:['Programmes','data/programmes.json',{name:['Émission','text'],host:['Animateur','text'],schedule:['Horaire','text'],description:['Description','textarea'],image:['Image','image'],active:['Active','check']}],
 podcasts:['Podcasts','data/podcasts.json',{title:['Titre','text'],description:['Description','textarea'],audio:['URL audio','text'],image:['Image','image'],active:['Publié','check']}],
 tv:['Ciwara TV','data/tv.json',{title:['Titre vidéo','text'],description:['Description','textarea'],video:['URL vidéo','text'],image:['Miniature','image'],active:['Publié','check']}],
 publicites:['Publicités','data/publicites.json',{title:['Campagne','text'],image:['Bannière','image'],link:['Lien','text'],active:['Active','check']}],
 partenaires:['Partenaires','data/partenaires.json',{name:['Nom','text'],logo:['Logo','image'],link:['Site / lien','text'],description:['Description','textarea'],active:['Visible','check']}],
 radio:['Radio','data/site-settings.json',{station:['Nom de la radio','text'],frequency:['Fréquence','text'],slogan:['Slogan','text'],presentation:['Présentation','textarea']}],
 accueil:['Accueil','data/accueil.json',{heroTitle:['Titre principal','text'],heroText:['Texte principal','textarea'],alert:['Alerte / breaking news','text'],featuredOrder:['Ordre des articles à la une','textarea']}],
 seo:['SEO','data/seo.json',{title:['Titre SEO','text'],description:['Description SEO','textarea'],canonical:['URL canonique','text'],ogImage:['Image Open Graph','image']}]
};
const tok=()=>sessionStorage.getItem(KEY);function status(t,c=''){$('status').textContent=t;$('status').className='status '+c}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+tok()};if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Connexion…';try{const r=await fetch(API+'/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Connexion refusée');sessionStorage.setItem(KEY,d.token);start()}catch(err){$('loginMsg').textContent=err.message}};
$('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};
function start(){if(!tok())return;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('nav').innerHTML='<button data-k="dashboard">Tableau de bord</button><button data-k="parutions">Parutions Ciwara Infos</button>'+Object.entries(C).map(([k,v])=>'<button data-k="'+k+'">'+v[0]+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.k));show('dashboard')}
function active(k){$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.k===k))}
async function show(k){if(k==='parutions'){location.href='parutions.html';return}active(k);$('filter').value='';if(k==='dashboard'){dashboard();return}const c=C[k];$('title').textContent=c[0];$('intro').textContent='Gestion structurée du contenu. Les modifications sont publiées via le CMS et ne modifient pas le lecteur Caster.fm.';$('searchBox').classList.remove('hidden');try{const d=await api('/file?path='+encodeURIComponent(c[1]));if(['radio','accueil','seo'].includes(k)){objectEditor(k,c,d);$('searchBox').classList.add('hidden')}else listEditor(k,c,d)}catch(e){status('Erreur : '+e.message,'err')}}
async function dashboard(){active('dashboard');$('title').textContent='Tableau de bord';$('intro').textContent='Vue d’ensemble du contenu de Radio Ciwara.';$('searchBox').classList.add('hidden');$('content').innerHTML='<div class="grid"><div class="stat"><span>Ciwara Infos</span><b id="n1">—</b></div><div class="stat"><span>Programmes</span><b id="n2">—</b></div><div class="stat"><span>Podcasts</span><b id="n3">—</b></div><div class="stat"><span>Ciwara TV</span><b id="n4">—</b></div></div><div class="protect"><b>Architecture protégée</b><span>Caster.fm est conservé tel quel. Les images importées sont rangées dans <code>assets/uploads/</code>. Les contenus sont stockés dans <code>data/*.json</code>.</span></div>';try{$('n1').textContent=(await api('/file?path=data/news.json')).data.items.length;$('n2').textContent=(await api('/file?path=data/programmes.json')).data.items.length;$('n3').textContent=(await api('/file?path=data/podcasts.json')).data.items.length;$('n4').textContent=(await api('/file?path=data/tv.json')).data.items.length;status('Données chargées.','ok')}catch(e){status(e.message,'err')}}
function fields(form,s,obj){Object.entries(s).forEach(([n,m])=>{const d=document.createElement('div');d.className='field';let e,label=document.createElement('label');label.textContent=m[0];label.htmlFor='f_'+n;d.appendChild(label);if(m[1]==='textarea')e=document.createElement('textarea');else{e=document.createElement('input');if(m[1]==='check')e.type='checkbox';if(m[1]==='number')e.type='number'}e.id='f_'+n;e.name=n;if(m[1]==='check'){label.className='check';label.prepend(e);d.innerHTML='';d.appendChild(label);const hint=document.createElement('div');hint.className='hint';hint.textContent='Activé = visible sur le site';d.appendChild(hint)}else{e.value=obj[n]??'';d.appendChild(e)}if(m[1]==='image'){const row=document.createElement('div');row.className='actions';const lab=document.createElement('label');lab.className='upload';lab.textContent='Choisir / envoyer une image';const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,image/gif,image/svg+xml';file.onchange=()=>uploadImage(file,e);lab.appendChild(file);row.appendChild(lab);d.appendChild(row);if(obj[n]){const im=document.createElement('img');im.className='preview';im.src=obj[n];im.onerror=()=>im.style.display='none';d.appendChild(im)}}form.appendChild(d)})}
async function uploadImage(file,input){const f=file.files[0];if(!f)return;if(f.size>8*1024*1024){status('Image trop volumineuse : 8 Mo maximum.','err');return}const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace('jpeg','jpg');const safe=f.name.replace(/[^a-zA-Z0-9_.-]/g,'-').replace(/\.+/g,'.');const path='assets/uploads/'+Date.now()+'-'+safe.replace(/\.(jpg|jpeg|png|webp|gif|svg)$/i,'.'+ext);status('Envoi de l’image…');const reader=new FileReader();reader.onload=async()=>{try{const base=String(reader.result).split(',')[1];const r=await api('/image',{method:'POST',body:JSON.stringify({path,contentBase64:base,message:'admin: upload '+f.name})});input.value=r.path;status('Image importée dans GitHub.','ok')}catch(e){status('Upload impossible : '+e.message,'err')}};reader.readAsDataURL(f)}
function read(form,s){const o={};Object.entries(s).forEach(([n,m])=>{if(m[1]==='check')o[n]=!!form.elements[n].checked;else if(m[1]==='number')o[n]=form.elements[n].value===''?0:Number(form.elements[n].value);else o[n]=form.elements[n].value});return o}
function objectEditor(k,c,d){$('content').innerHTML='<div class="editor"><form id="form"></form><div class="actions"><button class="btn primary" id="save">Enregistrer</button><button class="btn secondary" id="reload">Recharger</button></div></div>';fields($('form'),c[2],d.data);$('save').onclick=async()=>{try{await write(c[1],read($('form'),c[2]),d.sha,'admin: modifier '+k);show(k)}catch(e){status(e.message,'err')}};$('reload').onclick=()=>show(k)}
let currentItems=[];
function listEditor(k,c,d){currentItems=d.data.items||[];renderCards(k,c,d,currentItems);$('filter').oninput=()=>renderCards(k,c,d,currentItems.filter(x=>JSON.stringify(x).toLowerCase().includes($('filter').value.toLowerCase())))}
function renderCards(k,c,d,items){$('content').innerHTML='<div class="actions"><button class="btn primary" id="add">+ Ajouter</button><button class="btn secondary" id="refresh">Recharger</button><button class="btn secondary" id="sort">Trier par ordre</button></div><div id="cards" class="cards"></div><div id="editor"></div>';const cards=$('cards');if(!items.length){cards.innerHTML='<div class="empty">Aucun contenu pour le moment.</div>'}items.forEach((it,viewIndex)=>{const realIndex=d.data.items.indexOf(it),title=it.title||it.name||('Élément '+(realIndex+1)),meta=[it.category,it.source,it.host,it.schedule,it.date].filter(Boolean).join(' · ');const x=document.createElement('div');x.className='card';x.innerHTML='<div class="card-main"><h3>'+esc(title)+(it.featured?'<span class="pill">À LA UNE</span>':'')+(it.published===false||it.active===false?'<span class="pill">Masqué</span>':'')+'</h3><p>'+esc(meta||it.description||'')+'</p></div><div class="card-tools"><button class="icon" title="Monter">↑</button><button class="icon" title="Descendre">↓</button><button class="btn secondary edit">Modifier</button><button class="btn danger remove">Supprimer</button></div>';x.querySelectorAll('.icon')[0].onclick=()=>move(k,c,d,realIndex,-1);x.querySelectorAll('.icon')[1].onclick=()=>move(k,c,d,realIndex,1);x.querySelector('.edit').onclick=()=>edit(k,c,d,realIndex);x.querySelector('.remove').onclick=()=>del(k,c,d,realIndex);cards.appendChild(x)})
$('add').onclick=()=>edit(k,c,d,-1);$('refresh').onclick=()=>show(k);$('sort').onclick=()=>{d.data.items.sort((a,b)=>(Number(a.order)||9999)-(Number(b.order)||9999));write(c[1],d.data,d.sha,'admin: trier '+k).then(()=>show(k)).catch(e=>status(e.message,'err'))}}
function edit(k,c,d,i){const obj=i<0?{active:true,published:true,featured:false,order:d.data.items.length+1}:{...d.data.items[i]};$('editor').innerHTML='<div class="editor"><form id="ef"></form><div class="actions"><button class="btn primary" id="saveItem">Enregistrer</button><button class="btn secondary" id="cancel">Annuler</button></div></div>';fields($('ef'),c[2],obj);$('saveItem').onclick=async()=>{const v=read($('ef'),c[2]);if(i<0)d.data.items.push(v);else d.data.items[i]=v;try{await write(c[1],d.data,d.sha,'admin: '+(i<0?'ajouter':'modifier')+' '+k);show(k)}catch(e){status(e.message,'err')}};$('cancel').onclick=()=>show(k)}
async function move(k,c,d,i,delta){const j=i+delta;if(j<0||j>=d.data.items.length)return;[d.data.items[i],d.data.items[j]]=[d.data.items[j],d.data.items[i]];d.data.items.forEach((x,n)=>{if('order' in x)x.order=n+1});try{await write(c[1],d.data,d.sha,'admin: réordonner '+k);show(k)}catch(e){status(e.message,'err')}}
async function del(k,c,d,i){if(i<0||i>=d.data.items.length)return;if(!confirm('Supprimer définitivement cet élément ?'))return;d.data.items.splice(i,1);try{await write(c[1],d.data,d.sha,'admin: supprimer '+k);show(k)}catch(e){status(e.message,'err')}}
async function write(path,data,sha,message){status('Enregistrement dans GitHub…');await api('/file',{method:'PUT',body:JSON.stringify({path,data,sha,message})});status('Enregistré dans GitHub.','ok')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(tok())start();
</script>
</body></html>
